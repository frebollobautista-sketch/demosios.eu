<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Biblioteca — feed formativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260530-touchbar-v2">
  <link rel="stylesheet" href="sillas-conocimiento.css?v=20260530-touchbar-v2">
  <link rel="stylesheet" href="quorums-lectura.css?v=20260530-touchbar-v2">
  <link rel="stylesheet" href="pulso-palacios.css?v=20260530-touchbar-v2">
  <link rel="stylesheet" href="descubre.css?v=20260530-touchbar-v2">
</head>
<body>
  <!-- [INDIGO-SKIN 2026-05-29] Header OCRE portado de POLIS (mismo shell que
       agora-app, ver IDEAS.md "Tablero de aficiones"). Skin índigo: papel
       índigo oscuro / tinta clara / acento azul-pizarra + oro PHAROS. -->
  <div class="biblio-topshell">
    <header class="app-topbar" id="app-topbar">
      <div class="app-topbar-left">
        <div class="app-topbar-brand">
          <span class="brand-icon" aria-hidden="true"></span>
          <span class="brand-text">OCRE</span>
        </div>
        <code id="uid" class="topbar-uid-code" hidden></code>
      </div>

      <!-- Pilares visibles (interconexión siempre a la vista, no dropdown). -->
      <nav class="app-pillars" aria-label="Saltar entre pilares">
        <a class="pillar pillar-polis"      href="../polis-app/">POLIS</a>
        <a class="pillar pillar-agora"      href="../agora-app/">ÁGORA</a>
        <a class="pillar pillar-biblioteca is-active" href="../biblioteca-app/" aria-current="page">BIBLIOTHEKA</a>
      </nav>

      <div class="app-topbar-right">
        <button id="btn-descubre" class="app-topbar-iconbtn" type="button"
                aria-label="Descubre" title="Descubre una idea — modo serendípico formativo">✦</button>
        <button id="btn-nueva-sintesis" class="app-topbar-iconbtn" type="button"
                aria-label="Síntesis" title="Crear síntesis (G2)">✎</button>
        <button id="btn-nueva-mision" class="app-topbar-enter primary" type="button">+ Misión</button>
      </div>
    </header>

    <!-- Tira "multitouch": placeholder por ahora (banda visual continua con
         el header). Cuando biblioteca defina sus ejes de contexto
         (secciones PHAROS / grados del cursus / temas mnemoHACK), van aquí. -->
    <div id="biblio-strip" class="biblio-strip" role="tablist" aria-label="Biblioteca"></div>
  </div>

  <main class="app">

    <!-- Columna izquierda: sliders verticales -->
    <aside class="col left" id="sliders" aria-label="Sliders del algoritmo">
      <!-- pintado por app.js -->
    </aside>

    <!-- Columna centro: feed -->
    <section class="feed">
      <div class="feed-header">
        <h2>Feed</h2>
        <span class="feed-stats" id="feed-stats">…</span>
      </div>
      <div id="feed" aria-live="polite"><!-- cards --></div>
      <!-- Vacío como invitación: app.js lo muestra cuando ranked.length===0 -->
      <div id="feed-empty" class="feed-empty" hidden></div>
    </section>

    <!-- Columna derecha: misiones + honesty -->
    <aside class="col right" aria-label="Misiones y honesty meter">
      <div class="misiones-head">
        <h2>Misiones</h2>
      </div>
      <div class="mision-list" id="mision-list">
        <!-- pintado por app.js -->
      </div>

      <div class="sintesis-cta">
        <button id="btn-nueva-sintesis-side" onclick="document.getElementById('btn-nueva-sintesis').click()">
          ✎ Crear síntesis (G2)
        </button>
      </div>

      <div class="honesty" id="honesty">
        <!-- pintado por app.js -->
      </div>

      <!-- Acciones masa crítica v3 -->
      <div class="biblio-actions">
        <button id="btn-abrir-pulso-palacios" class="btn-ghost-wide" type="button">
          📡 Pulso de palacios (30d)
        </button>
        <button id="btn-nuevo-quorum-lectura" class="btn-ghost-wide" type="button">
          ▸ Convocar lectura
        </button>
      </div>

      <div class="tokens-block" id="tokens-block"></div>
    </aside>

  </main>

  <!-- Modal de quórum de lectura -->
  <div class="modal-backdrop" id="modal-quorum-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-quorum-title">
      <h2 id="modal-quorum-title">Convocar lectura conjunta</h2>
      <p class="modal-hint">
        Una lectura se "abre" cuando alcanza N personas antes de la fecha.
        Sin urgencia: si no llega, vuelve como propuesta archivada.
      </p>
      <label>Título <input id="ql-titulo" type="text" maxlength="120" required placeholder="Leer 'Republicanismo' (Pettit)"></label>
      <label>Autor / fuente
        <input id="ql-autor" type="text" maxlength="120" placeholder="Pettit, 1997">
      </label>
      <label>Descripción (opcional)
        <textarea id="ql-descripcion" maxlength="280" rows="2"></textarea>
      </label>
      <div style="display:flex; gap:0.6rem;">
        <label style="flex:1;">Personas necesarias
          <input id="ql-umbral" type="number" min="2" max="100" value="6" required>
        </label>
        <label style="flex:1;">Deadline (cierre)
          <input id="ql-deadline" type="date" required>
        </label>
      </div>
      <label>Fecha de inicio de la lectura
        <input id="ql-fecha-evento" type="date">
      </label>
      <label>Tema mnemoHACK relacionado (opcional)
        <input id="ql-tema" type="text" maxlength="10" placeholder="t14">
      </label>
      <div class="modal-actions">
        <button class="btn-cancel" id="ql-cancel" type="button">cancelar</button>
        <button class="btn-confirm" id="ql-confirm" type="button">convocar lectura</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=20260530-touchbar-v2"></script>
</body>
</html>
