<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOINOS POLIS — v2 Tablero</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,sans-serif}
#map{width:100%;height:100vh}

.info-panel{
  position:fixed;top:10px;left:10px;z-index:10;
  background:rgba(10,10,10,0.92);border:1px solid #333;border-radius:10px;
  padding:14px;max-width:320px;font-size:13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:all .3s;
}
.info-panel h1{font-size:15px;color:#d4c4a0;letter-spacing:1px;margin-bottom:4px;font-weight:600}
.info-panel .sub{color:#666;font-size:10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}

.breadcrumb{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.breadcrumb span{
  background:#1a1a1a;padding:3px 8px;border-radius:4px;font-size:11px;
  cursor:pointer;border:1px solid #2a2a2a;transition:all .15s;color:#aaa;
}
.breadcrumb span:hover{background:#252525;border-color:#444;color:#ddd}
.breadcrumb span.active{background:#d4c4a0;color:#111;font-weight:600;border-color:#d4c4a0;cursor:default}
.breadcrumb span.sep{background:none;border:none;color:#555;cursor:default;padding:3px 2px}
.breadcrumb span.sep:hover{background:none;color:#555}

.nav-btns{
  position:fixed;top:10px;right:10px;z-index:10;
  display:flex;flex-direction:column;gap:4px;
}
.nav-btns button{
  width:34px;height:34px;border-radius:8px;border:1px solid #333;
  background:rgba(10,10,10,0.92);color:#d4c4a0;font-size:16px;
  cursor:pointer;backdrop-filter:blur(8px);transition:all .15s;
  display:flex;align-items:center;justify-content:center;font-weight:600;
}
.nav-btns button:hover{background:#1a1a1a;border-color:#555}
.nav-btns button:disabled{opacity:0.3;cursor:default}

.stats{font-size:11px;color:#aaa;margin-top:8px;line-height:1.6}
.stats b{color:#d4c4a0}

.loading-msg{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(10,10,10,0.92);color:#d4c4a0;padding:8px 16px;border-radius:8px;
  font-size:11px;font-weight:600;display:none;border:1px solid rgba(212,196,160,0.2);
  backdrop-filter:blur(8px);
}
.loading-msg.on{display:block}

.dis-list{margin-top:6px}
.dis-item{
  padding:6px 8px;border-radius:6px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;gap:8px;margin-bottom:2px;
  background:#111;border:1px solid #1e1e1e;transition:all .15s;
}
.dis-item:hover{background:#1a1a1a;border-color:#3a3a3a}
.dis-item .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.dis-item .name{color:#bbb;flex:1}
.dis-item .count{color:#555;font-size:10px}

.maplibregl-popup-content{
  background:rgba(12,12,12,0.97)!important;
  border:1px solid rgba(212,196,160,0.15)!important;
  border-radius:10px!important;color:#e0e0e0!important;padding:0!important;
  backdrop-filter:blur(10px)!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;
}
.maplibregl-popup-tip{border-top-color:rgba(12,12,12,0.97)!important}
.maplibregl-popup-close-button{color:#888!important;font-size:16px!important;right:4px!important;top:2px!important}

.layer-toggles{margin-top:8px;border-top:1px solid #1e1e1e;padding-top:8px;display:none}
.layer-toggles.on{display:block}
.ltoggle{display:flex;align-items:center;gap:6px;margin-bottom:3px;cursor:pointer;font-size:10px;color:#888}
.ltoggle:hover{color:#bbb}
.ltoggle .ldot{width:6px;height:6px;border-radius:1px;flex-shrink:0}
.ltoggle input{display:none}
.ltoggle.off .ldot{opacity:0.3}
.ltoggle.off{color:#444}
</style>
</head>
<body>
<div id="map"></div>

<div class="info-panel">
  <h1>K0IN0S POLIS</h1>
  <div class="sub">Las Palmas de Gran Canaria</div>
  <div class="breadcrumb" id="breadcrumb">
    <span class="active">Las Palmas de GC</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="dis-list" id="dis-list"></div>
  <div class="layer-toggles" id="layer-toggles">
    <div class="ltoggle" onclick="toggleLayer('osm-roads',this)"><div class="ldot" style="background:#3a3530"></div>Carreteras</div>
    <div class="ltoggle" onclick="toggleLayer('osm-parks',this)"><div class="ldot" style="background:#2a5a18"></div>Parques</div>
    <div class="ltoggle" onclick="toggleLayer('osm-coast',this)"><div class="ldot" style="background:#2a6a9a"></div>Costa</div>
    <div class="ltoggle" onclick="toggleLayer('osm-water',this)"><div class="ldot" style="background:#1a4a6a"></div>Agua</div>
    <div class="ltoggle" onclick="toggleLayer('osm-pois',this)"><div class="ldot" style="background:#d4c4a0"></div>POIs</div>
    <div class="ltoggle" onclick="toggleLayer('hillshade',this)"><div class="ldot" style="background:#8a7a5a"></div>Terreno</div>
  </div>
</div>

<div class="nav-btns">
  <button id="btn-up" onclick="goUp()" title="Subir nivel">-</button>
  <button id="btn-down" onclick="goDown()" title="Bajar nivel" disabled>+</button>
</div>

<div class="loading-msg" id="loading-msg">Cargando edificios...</div>

<script>
var LPA_CENTER = [-15.4134, 28.1235];
// Single color per municipality, lighter at deeper levels
var MUNICIPIO_COLOR = '#c4a060';
var DIS_COLORS = {
  '01':MUNICIPIO_COLOR,'02':MUNICIPIO_COLOR,'03':MUNICIPIO_COLOR,'04':MUNICIPIO_COLOR,'05':MUNICIPIO_COLOR
};
var DIS_NAMES = {
  '01':'Vegueta, Cono Sur y Tafira',
  '02':'Centro',
  '03':'Isleta - Puerto - Guanarteme',
  '04':'Ciudad Alta',
  '05':'Tamaraceite - San Lorenzo - Tenoya'
};
var DIS_SECCIONES = {'01':58,'02':58,'03':45,'04':79,'05':34};

var level = 'city';
var activeDis = null;
var activeSec = null;
var DISTRITOS = null;
var SECCIONES = null;
var OSM = {buildings:null, roads:null, parks:null, coastline:null, pois:null, water:null};
var osmLoaded = false;

var BUILDING_COLOR_BASE = '#8a7a60';
var BUILDING_COLOR_HOVER = '#d4c4a0';

var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      'esri-satellite': {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256, attribution: 'Esri'
      },
      'carto-labels': {
        type: 'raster',
        tiles: ['https://basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}@2x.png'],
        tileSize: 256, attribution: 'CARTO'
      }
    },
    layers: [
      {id:'satellite',type:'raster',source:'esri-satellite',minzoom:0,maxzoom:19,
       paint:{'raster-opacity':0.85,'raster-saturation':-0.1}},
      {id:'labels',type:'raster',source:'carto-labels',minzoom:13,maxzoom:19,
       paint:{'raster-opacity':0.7}}
    ],
    light: {
      anchor: 'viewport',
      color: '#ffe8c0',
      intensity: 0.6,
      position: [1.5, 210, 30]
    }
  },
  center: LPA_CENTER, zoom: 12.5, pitch: 0, bearing: 0,
  maxBounds: [[-15.6, 27.95], [-15.2, 28.25]],
  antialias: true
});

map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'bottom-right');

// ========== BOOT ==========
map.on('load', function() {
  // Add terrain hillshade for mountain vs coast differentiation
  map.addSource('terrain-dem', {
    type: 'raster-dem',
    tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
    tileSize: 256,
    encoding: 'terrarium',
    maxzoom: 15
  });
  map.addLayer({
    id: 'hillshade',
    type: 'hillshade',
    source: 'terrain-dem',
    paint: {
      'hillshade-exaggeration': 0.35,
      'hillshade-shadow-color': '#1a1008',
      'hillshade-highlight-color': '#ffe8c0',
      'hillshade-illumination-direction': 315,
      'hillshade-illumination-anchor': 'map'
    }
  }, 'labels'); // Insert below labels

  // Load geo boundaries + OSM context layers in parallel
  Promise.all([
    fetch('lpgc-distritos.json').then(function(r){return r.json();}),
    fetch('polis-secciones.json').then(function(r){return r.json();}),
    fetch('osm/roads.json').then(function(r){return r.json();}),
    fetch('osm/parks.json').then(function(r){return r.json();}),
    fetch('osm/coastline.json').then(function(r){return r.json();}),
    fetch('osm/pois.json').then(function(r){return r.json();}),
    fetch('osm/water.json').then(function(r){return r.json();})
  ]).then(function(results) {
    DISTRITOS = results[0];
    SECCIONES = results[1];
    OSM.roads = results[2];
    OSM.parks = results[3];
    OSM.coastline = results[4];
    OSM.pois = results[5];
    OSM.water = results[6];
    osmContextReady = true;

    // Setup all visual layers (visible from boot)
    setupOSMCoast();
    setupOSMWater();
    setupOSMParks();
    setupOSMRoads();
    setupOSMPois();
    // Show 2D layers by default (subtle at low zoom, more visible at high zoom)
    ['osm-coast','osm-parks','osm-roads'].forEach(function(id){
      if(map.getLayer(id)) map.setLayoutProperty(id,'visibility','visible');
    });
    if(map.getLayer('osm-water')) map.setLayoutProperty('osm-water','visibility','visible');

    // Then the interactive layers on top
    setupDistritosLayer();
    setupSeccionesLayer();
    showCity();
    console.log('All layers loaded: '+OSM.roads.features.length+' roads, '+OSM.parks.features.length+' parks, '+(OSM.water?OSM.water.features.length:0)+' water');
  });
});

// ========== OSM CONTEXT LAYERS ==========
var osmContextLoading = false;
var osmContextReady = false;

function loadOSMContextLazy() {
  // Now loaded at boot — this is a no-op kept for compatibility
  return Promise.resolve();
}

// Load OSM building names only for a specific section bbox (not the full 13MB file)
var osmBuildingsLoaded = false;
function loadOSMBuildingsLazy() {
  if (osmBuildingsLoaded || OSM.buildings) return Promise.resolve();
  console.log('Loading OSM buildings index...');
  return fetch('osm/buildings.json').then(function(r){return r.json();}).then(function(data) {
    OSM.buildings = data;
    osmBuildingsLoaded = true;
    OSM.buildings.features.forEach(function(f) {
      if (f.geometry.type !== 'Polygon') return;
      var coords = f.geometry.coordinates[0];
      var cx = 0, cy = 0;
      for (var i = 0; i < coords.length; i++) { cx += coords[i][0]; cy += coords[i][1]; }
      cx /= coords.length; cy /= coords.length;
      f.properties._cx = cx;
      f.properties._cy = cy;
    });
    console.log('OSM buildings indexed: ' + data.features.length);
  }).catch(function(e) {
    console.warn('OSM buildings failed:', e);
  });
}

function setupOSMRoads() {
  map.addSource('osm-roads', {type:'geojson', data: OSM.roads});
  // Primary/secondary visible from zoom 12, rest from 14+
  map.addLayer({
    id:'osm-roads', type:'line', source:'osm-roads',
    paint:{
      'line-color':['match',['get','highway'],
        'primary','#5a5040','secondary','#4a4030',
        '#3a3528'],
      'line-width':['interpolate',['linear'],['zoom'],
        12, ['match',['get','highway'],'primary',1.5,'secondary',1, 0],
        14, ['match',['get','highway'],'primary',3,'secondary',2.2,'tertiary',1.5,'residential',0.8, 0.5],
        17, ['match',['get','highway'],'primary',5,'secondary',3.5,'tertiary',2.5,'residential',1.2,'pedestrian',0.8,'living_street',0.8, 0.6]
      ],
      'line-opacity':['interpolate',['linear'],['zoom'], 12,0.3, 14,0.5, 16,0.6]
    },
    layout:{visibility:'none'},
    minzoom: 12
  });
}

function setupOSMParks() {
  var parkPolys = {type:'FeatureCollection',features:OSM.parks.features.filter(function(f){return f.geometry.type==='Polygon';})};
  map.addSource('osm-parks', {type:'geojson', data: parkPolys});
  map.addLayer({
    id:'osm-parks', type:'fill', source:'osm-parks',
    paint:{
      'fill-color':'#2a5a18',
      'fill-opacity':['interpolate',['linear'],['zoom'], 12,0.25, 14,0.4, 16,0.5]
    },
    layout:{visibility:'none'},
    minzoom: 12
  });
  map.addLayer({
    id:'osm-parks-label', type:'symbol', source:'osm-parks',
    layout:{
      'text-field':['get','name'],
      'text-size':9,
      'text-allow-overlap':false,
      visibility:'none'
    },
    paint:{'text-color':'#5a8a40','text-halo-color':'rgba(0,0,0,0.6)','text-halo-width':1},
    minzoom: 14
  });
}

function setupOSMCoast() {
  map.addSource('osm-coast', {type:'geojson', data: OSM.coastline});
  // Beach polygons
  var beaches = {type:'FeatureCollection',features:OSM.coastline.features.filter(function(f){return f.properties.type==='beach'&&f.geometry.type==='Polygon';})};
  if(beaches.features.length){
    map.addSource('osm-beaches',{type:'geojson',data:beaches});
    map.addLayer({
      id:'osm-beaches',type:'fill',source:'osm-beaches',
      paint:{'fill-color':'#d4c498','fill-opacity':['interpolate',['linear'],['zoom'],12,0.3,15,0.5]},
      minzoom:12
    });
  }
  // Coastline
  map.addLayer({
    id:'osm-coast', type:'line', source:'osm-coast',
    paint:{
      'line-color':'#2a6a9a',
      'line-width':['interpolate',['linear'],['zoom'],12,1.5,16,3],
      'line-opacity':0.6
    },
    layout:{visibility:'none'},
    minzoom: 11
  });
}

function setupOSMWater() {
  if(!OSM.water) return;
  var waterPolys = {type:'FeatureCollection',features:OSM.water.features.filter(function(f){return f.geometry.type==='Polygon';})};
  map.addSource('osm-water',{type:'geojson',data:waterPolys});
  map.addLayer({
    id:'osm-water',type:'fill',source:'osm-water',
    paint:{
      'fill-color':'#1a4a6a',
      'fill-opacity':['interpolate',['linear'],['zoom'],13,0.3,16,0.5]
    },
    layout:{visibility:'none'},
    minzoom:13
  });
}

function setupOSMPois() {
  var poiPts = {type:'FeatureCollection',features:OSM.pois.features.filter(function(f){return f.geometry.type==='Point'&&f.properties.name;})};
  map.addSource('osm-pois', {type:'geojson', data: poiPts});
  map.addLayer({
    id:'osm-pois', type:'circle', source:'osm-pois',
    paint:{
      'circle-radius':['interpolate',['linear'],['zoom'],14,1.5,16,3,18,4],
      'circle-color':'#d4c4a0','circle-opacity':0.6,
      'circle-stroke-width':0.5,'circle-stroke-color':'#0a0a0a'
    },
    layout:{visibility:'none'},
    minzoom: 14
  });
  map.addLayer({
    id:'osm-pois-label', type:'symbol', source:'osm-pois',
    layout:{
      'text-field':['get','name'],
      'text-size':9,
      'text-offset':[0.8,0],
      'text-anchor':'left',
      'text-allow-overlap':false,
      visibility:'none'
    },
    paint:{'text-color':'#b0a080','text-halo-color':'rgba(0,0,0,0.7)','text-halo-width':1},
    minzoom: 15
  });
}

function showOSMContext(show) {
  // Base layers (roads, parks, coast, water) are always visible — only toggle POIs and labels at section level
  var poiVis = show ? 'visible' : 'none';
  ['osm-pois','osm-pois-label','osm-parks-label'].forEach(function(id) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', poiVis);
  });
  var lt = document.getElementById('layer-toggles');
  if (show && osmContextReady) lt.classList.add('on'); else lt.classList.remove('on');
}

function toggleLayer(layerId, el) {
  if (!map.getLayer(layerId)) return;
  var cur = map.getLayoutProperty(layerId, 'visibility');
  var newVis = cur === 'visible' ? 'none' : 'visible';
  map.setLayoutProperty(layerId, 'visibility', newVis);
  // Also toggle associated label layers
  if (layerId === 'osm-parks' && map.getLayer('osm-parks-label'))
    map.setLayoutProperty('osm-parks-label', 'visibility', newVis);
  if (layerId === 'osm-pois' && map.getLayer('osm-pois-label'))
    map.setLayoutProperty('osm-pois-label', 'visibility', newVis);
  el.classList.toggle('off');
}

// ========== DISTRITOS LAYER ==========
function setupDistritosLayer() {
  DISTRITOS.features.forEach(function(f, i) {
    f.id = i;
    f.properties._color = DIS_COLORS[f.properties.dis] || '#888';
  });
  map.addSource('distritos', {type:'geojson', data: DISTRITOS});

  map.addLayer({
    id:'distritos-fill', type:'fill', source:'distritos',
    paint:{
      'fill-color':MUNICIPIO_COLOR,
      'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.15,0]
    }
  });
  map.addLayer({
    id:'distritos-line', type:'line', source:'distritos',
    paint:{
      'line-color':'#d4c4a0',
      'line-width':['case',['boolean',['feature-state','hover'],false],1.5,0],
      'line-opacity':['case',['boolean',['feature-state','hover'],false],0.6,0]
    }
  });
  map.addLayer({
    id:'distritos-label', type:'symbol', source:'distritos',
    layout:{
      'text-field':['get','dis'],
      'text-size':13,
      'text-font':['Open Sans Bold','Arial Unicode MS Bold'],
      'text-allow-overlap':true
    },
    paint:{
      'text-color':'#d4c4a0','text-halo-color':'rgba(0,0,0,0.8)','text-halo-width':2,
      'text-opacity':['case',['boolean',['feature-state','hover'],false],0.8,0]
    },
    minzoom:11
  });

  var hovId = null;
  map.on('mousemove','distritos-fill',function(e){
    if(level!=='city')return;
    map.getCanvas().style.cursor='pointer';
    if(e.features.length){
      if(hovId!==null)map.setFeatureState({source:'distritos',id:hovId},{hover:false});
      hovId=e.features[0].id;
      map.setFeatureState({source:'distritos',id:hovId},{hover:true});
    }
  });
  map.on('mouseleave','distritos-fill',function(){
    map.getCanvas().style.cursor='';
    if(hovId!==null){map.setFeatureState({source:'distritos',id:hovId},{hover:false});hovId=null;}
  });
  map.on('click','distritos-fill',function(e){
    if(level!=='city'||!e.features.length)return;
    enterDistrito(e.features[0].properties.dis);
  });
}

// ========== SECCIONES LAYER ==========
function setupSeccionesLayer() {
  SECCIONES.features.forEach(function(f,i){
    f.id=i;
    f.properties._color=DIS_COLORS[f.properties.dis]||'#888';
  });
  map.addSource('secciones',{type:'geojson',data:SECCIONES});

  map.addLayer({
    id:'secciones-fill',type:'fill',source:'secciones',
    paint:{
      'fill-color':'#d4c4a0',
      'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.3,0.08]
    },
    layout:{visibility:'none'}
  });
  map.addLayer({
    id:'secciones-line',type:'line',source:'secciones',
    paint:{
      'line-color':'#d4c4a0',
      'line-width':['case',['boolean',['feature-state','hover'],false],1.5,0.4],
      'line-opacity':0.4
    },
    layout:{visibility:'none'}
  });
  map.addLayer({
    id:'secciones-label',type:'symbol',source:'secciones',
    layout:{'text-field':['get','sec'],'text-size':10,'text-allow-overlap':false,visibility:'none'},
    paint:{'text-color':'#ddd','text-halo-color':'rgba(0,0,0,0.6)','text-halo-width':1},
    minzoom:14
  });

  var hovId=null;
  map.on('mousemove','secciones-fill',function(e){
    if(level!=='distrito'&&level!=='seccion')return;
    // At section level, ignore hover on the active section
    if(level==='seccion'&&e.features.length&&e.features[0].properties.cusec===activeSec)return;
    map.getCanvas().style.cursor='pointer';
    if(e.features.length){
      if(hovId!==null)map.setFeatureState({source:'secciones',id:hovId},{hover:false});
      hovId=e.features[0].id;
      map.setFeatureState({source:'secciones',id:hovId},{hover:true});
    }
  });
  map.on('mouseleave','secciones-fill',function(){
    if(level!=='distrito'&&level!=='seccion')return;
    map.getCanvas().style.cursor='';
    if(hovId!==null){map.setFeatureState({source:'secciones',id:hovId},{hover:false});hovId=null;}
  });
  map.on('click','secciones-fill',function(e){
    if(!e.features.length)return;
    if(level==='distrito'){
      enterSeccion(e.features[0].properties.cusec, e.features[0].properties.dis);
    }else if(level==='seccion'){
      var clickedCusec=e.features[0].properties.cusec;
      if(clickedCusec!==activeSec){
        enterSeccion(clickedCusec, e.features[0].properties.dis);
      }
    }
  });
}

// ========== LEVEL: CITY ==========
function showCity() {
  level='city'; activeDis=null; activeSec=null;
  setLayerVis('distritos-fill',true);setLayerVis('distritos-line',true);setLayerVis('distritos-label',true);
  setLayerVis('secciones-fill',false);setLayerVis('secciones-line',false);setLayerVis('secciones-label',false);
  // Reset secciones paint to defaults
  map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.3,0.08]);
  map.setPaintProperty('secciones-line','line-opacity',0.4);
  removeBuildings();
  showOSMContext(false);
  if(map.getLayer('dis-highlight'))map.removeLayer('dis-highlight');

  map.flyTo({center:LPA_CENTER,zoom:12.5,pitch:0,bearing:0,duration:1000,essential:true});
  updateBreadcrumb();
  updateNavBtns();
  document.getElementById('stats').innerHTML='<b>5</b> distritos · <b>274</b> secciones censales · <b>26 603</b> edificios<br>Selecciona un distrito';
  renderDisList(null);
}

// ========== LEVEL: DISTRITO ==========
function enterDistrito(dis) {
  level='distrito'; activeDis=dis; activeSec=null;
  setLayerVis('distritos-fill',false);setLayerVis('distritos-line',false);setLayerVis('distritos-label',false);
  removeBuildings();
  showOSMContext(false);

  // Reset secciones paint to normal distrito-level opacity
  map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.3,0.08]);
  map.setPaintProperty('secciones-line','line-opacity',0.4);

  map.setFilter('secciones-fill',['==',['get','dis'],dis]);
  map.setFilter('secciones-line',['==',['get','dis'],dis]);
  map.setFilter('secciones-label',['==',['get','dis'],dis]);
  setLayerVis('secciones-fill',true);setLayerVis('secciones-line',true);setLayerVis('secciones-label',true);

  var disFeat=null;
  DISTRITOS.features.forEach(function(f){if(f.properties.dis===dis)disFeat=f;});
  if(map.getLayer('dis-highlight'))map.removeLayer('dis-highlight');
  if(!map.getSource('dis-highlight'))
    map.addSource('dis-highlight',{type:'geojson',data:{type:'FeatureCollection',features:disFeat?[disFeat]:[]}});
  else map.getSource('dis-highlight').setData({type:'FeatureCollection',features:disFeat?[disFeat]:[]});
  map.addLayer({
    id:'dis-highlight',type:'line',source:'dis-highlight',
    paint:{'line-color':'#d4c4a0','line-width':1.5,'line-opacity':0.4,'line-dasharray':[4,2]}
  });

  if(disFeat){
    var bounds=getBounds(disFeat.geometry);
    var center=[(bounds[0][0]+bounds[1][0])/2,(bounds[0][1]+bounds[1][1])/2];
    // Use flyTo for smoother transition instead of fitBounds
    map.flyTo({center:center,zoom:14,pitch:0,duration:1200,essential:true});
  }

  updateBreadcrumb();
  updateNavBtns();
  document.getElementById('stats').innerHTML=
    '<b>'+DIS_SECCIONES[dis]+'</b> secciones · D'+dis+' '+DIS_NAMES[dis]+
    '<br>Selecciona una seccion censal';
  renderDisList(dis);
}

// ========== LEVEL: SECCION (buildings) ==========
var SEC_CACHE = {};

function enterSeccion(cusec, dis) {
  var ldg = document.getElementById('loading-msg');

  if (SEC_CACHE[cusec]) {
    _doEnterSeccion(cusec, dis, SEC_CACHE[cusec]);
    return;
  }

  if (ldg) ldg.classList.add('on');

  // Load OSM context + buildings in parallel with section data
  loadOSMContextLazy();
  loadOSMBuildingsLazy();

  fetch('buildings/' + cusec + '.json')
    .then(function(r){return r.json();})
    .then(function(raw) {
      var features = raw.map(function(b, i) {
        var coords = b[0];
        var h = b[1];
        var realLevels = b.length > 2 ? b[2] : 0;
        return {
          type:'Feature',
          geometry:{type:'Polygon',coordinates:[coords]},
          properties:{_h:h,'building:levels':realLevels,_id:i}
        };
      });

      // Enrich with OSM data (name, address, type)
      if (OSM.buildings) {
        var secFeat = null;
        SECCIONES.features.forEach(function(f){if(f.properties.cusec===cusec)secFeat=f;});
        if (secFeat) {
          var sb = getBounds(secFeat.geometry);
          var osmInSec = OSM.buildings.features.filter(function(of) {
            var cx = of.properties._cx, cy = of.properties._cy;
            return cx >= sb[0][0] && cx <= sb[1][0] && cy >= sb[0][1] && cy <= sb[1][1];
          });
          // Match by proximity
          features.forEach(function(f) {
            var fc = f.geometry.coordinates[0];
            var fcx = 0, fcy = 0;
            for (var i = 0; i < fc.length; i++) { fcx += fc[i][0]; fcy += fc[i][1]; }
            fcx /= fc.length; fcy /= fc.length;
            var bestDist = 0.0002; // ~20m threshold
            var bestOSM = null;
            osmInSec.forEach(function(of) {
              var d = Math.abs(of.properties._cx - fcx) + Math.abs(of.properties._cy - fcy);
              if (d < bestDist) { bestDist = d; bestOSM = of; }
            });
            if (bestOSM) {
              var op = bestOSM.properties;
              if (op.name) f.properties.name = op.name;
              if (op.street) f.properties['addr:street'] = op.street;
              if (op.housenumber) f.properties['addr:housenumber'] = op.housenumber;
              if (op.building_type) f.properties.building = op.building_type;
              if (op.amenity) f.properties.amenity = op.amenity;
              if (op.tourism) f.properties.tourism = op.tourism;
              if (op.shop) f.properties.shop = op.shop;
              if (op.levels && !f.properties['building:levels']) f.properties['building:levels'] = op.levels;
            }
          });
        }
      }

      SEC_CACHE[cusec] = features;
      if (ldg) ldg.classList.remove('on');
      _doEnterSeccion(cusec, dis, features);
    })
    .catch(function(e) {
      console.error('Error loading buildings for ' + cusec + ':', e);
      if (ldg) ldg.classList.remove('on');
      _doEnterSeccion(cusec, dis, []);
    });
}

function _doEnterSeccion(cusec, dis, secFeatures) {
  level='seccion'; activeSec=cusec; activeDis=dis;
  // Keep ALL secciones visible (no district filter) so any neighbor is clickable
  map.setFilter('secciones-fill',null);
  map.setFilter('secciones-line',null);
  map.setFilter('secciones-label',null);
  setLayerVis('secciones-fill',true);setLayerVis('secciones-line',true);setLayerVis('secciones-label',false);
  // Make secciones nearly invisible — just enough to capture clicks
  map.setPaintProperty('secciones-fill','fill-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.2,
    0.03
  ]);
  map.setPaintProperty('secciones-line','line-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.5,
    0.15
  ]);

  // Show OSM context layers
  showOSMContext(true);

  // Update distrito highlight if we crossed into a different district
  var disFeat=null;
  DISTRITOS.features.forEach(function(f){if(f.properties.dis===dis)disFeat=f;});
  if(map.getSource('dis-highlight'))
    map.getSource('dis-highlight').setData({type:'FeatureCollection',features:disFeat?[disFeat]:[]});

  var secFeature=null,barrio='';
  SECCIONES.features.forEach(function(f){
    if(f.properties.cusec===cusec){secFeature=f;barrio=f.properties.barrio||'';}
  });

  if(map.getLayer('sec-highlight'))map.removeLayer('sec-highlight');
  if(!map.getSource('sec-highlight'))
    map.addSource('sec-highlight',{type:'geojson',data:{type:'FeatureCollection',features:secFeature?[secFeature]:[]}});
  else map.getSource('sec-highlight').setData({type:'FeatureCollection',features:secFeature?[secFeature]:[]});
  map.addLayer({
    id:'sec-highlight',type:'line',source:'sec-highlight',
    paint:{'line-color':'#e0d0b0','line-width':1,'line-opacity':0.5}
  });

  secFeatures.forEach(function(f){f.properties._barrio=barrio;f.properties._cusec=cusec;});
  var buildingData={type:'FeatureCollection',features:secFeatures};

  if(map.getSource('buildings'))map.getSource('buildings').setData(buildingData);
  else map.addSource('buildings',{type:'geojson',data:buildingData});

  if(map.getLayer('buildings-3d'))map.removeLayer('buildings-3d');
  if(map.getLayer('buildings-outline'))map.removeLayer('buildings-outline');
  if(map.getLayer('buildings-label'))map.removeLayer('buildings-label');

  // Shadow layer: dark footprint offset to simulate cast shadow
  if(map.getLayer('buildings-shadow'))map.removeLayer('buildings-shadow');
  var shadowFeatures = secFeatures.map(function(f) {
    // Offset polygon coords to SE to simulate sun from NW
    var h = f.properties._h || 8;
    var offsetLng = h * 0.000004;  // ~0.4m per meter height
    var offsetLat = -h * 0.000003; // shadow falls south-east
    var newCoords = f.geometry.coordinates[0].map(function(c) {
      return [c[0] + offsetLng, c[1] + offsetLat];
    });
    return {
      type:'Feature',
      geometry:{type:'Polygon',coordinates:[newCoords]},
      properties:{_h:h}
    };
  });
  var shadowData = {type:'FeatureCollection',features:shadowFeatures};
  if(map.getSource('building-shadows'))map.getSource('building-shadows').setData(shadowData);
  else map.addSource('building-shadows',{type:'geojson',data:shadowData});
  map.addLayer({
    id:'buildings-shadow',type:'fill',source:'building-shadows',
    paint:{
      'fill-color':'#000000',
      'fill-opacity':['interpolate',['linear'],['get','_h'],
        3, 0.10,
        8, 0.18,
        15, 0.28,
        25, 0.35
      ]
    }
  });

  // Buildings: visible extrusions with real heights
  map.addLayer({
    id:'buildings-3d',type:'fill-extrusion',source:'buildings',
    paint:{
      'fill-extrusion-color':[
        'case',
        ['boolean',['feature-state','hover'],false], '#f0e0c0',
        '#c8b898'
      ],
      'fill-extrusion-height':['*',['get','_h'],1],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.92,
      'fill-extrusion-vertical-gradient':true
    }
  });

  // Labels for named buildings
  var namedFeatures = secFeatures.filter(function(f){return f.properties.name;});
  if (namedFeatures.length > 0) {
    var namedData = {type:'FeatureCollection',features:namedFeatures};
    if(map.getSource('building-labels'))map.getSource('building-labels').setData(namedData);
    else map.addSource('building-labels',{type:'geojson',data:namedData});
    map.addLayer({
      id:'buildings-label',type:'symbol',source:'building-labels',
      layout:{
        'text-field':['get','name'],
        'text-size':9,
        'text-allow-overlap':false,
        'text-anchor':'center'
      },
      paint:{'text-color':'#d4c4a0','text-halo-color':'rgba(0,0,0,0.8)','text-halo-width':1.5},
      minzoom:16
    });
  }

  // Hover on buildings
  var bHovId = null;
  map.on('mousemove','buildings-3d',function(e){
    if(level!=='seccion')return;
    map.getCanvas().style.cursor='pointer';
    if(e.features.length){
      if(bHovId!==null)map.setFeatureState({source:'buildings',id:bHovId},{hover:false});
      bHovId=e.features[0].id;
      if(bHovId===undefined){
        bHovId=e.features[0].properties._id;
        e.features[0].id=bHovId;
      }
      map.setFeatureState({source:'buildings',id:bHovId},{hover:true});
    }
  });
  map.on('mouseleave','buildings-3d',function(){
    map.getCanvas().style.cursor='';
    if(bHovId!==null){map.setFeatureState({source:'buildings',id:bHovId},{hover:false});bHovId=null;}
  });

  map.on('click','buildings-3d',buildingClick);

  // Camera: fly to section and tilt for 3D view
  if(secFeature){
    var bounds=getBounds(secFeature.geometry);
    var center=[(bounds[0][0]+bounds[1][0])/2,(bounds[0][1]+bounds[1][1])/2];
    map.flyTo({center:center,zoom:17,pitch:55,bearing:map.getBearing(),duration:1200,essential:true});
  }

  updateBreadcrumb();
  updateNavBtns();
  var sec=cusec.slice(-3);
  var namedCount=secFeatures.filter(function(f){return f.properties.name;}).length;
  var addrCount=secFeatures.filter(function(f){return f.properties['addr:street'];}).length;
  document.getElementById('stats').innerHTML=
    '<b>'+secFeatures.length+'</b> edificios en S'+sec+(barrio?' · '+barrio:'')+
    '<br><span style="font-size:10px;color:#555">'+namedCount+' con nombre · '+addrCount+' con direccion</span>'+
    '<br><span style="font-size:10px;color:#555">Clic en edificio para info · Arrastra para rotar</span>';
  document.getElementById('dis-list').innerHTML='';
}

// ========== BUILDING POPUP ==========
function buildingClick(e) {
  if(!e.features||!e.features.length)return;
  var p=e.features[0].properties;
  var h='<div style="padding:12px;font-family:system-ui;font-size:12px;color:#e0e0e0">';

  // Name or address
  var title = p.name || '';
  if (!title && p['addr:street']) {
    title = p['addr:street'];
    if (p['addr:housenumber']) title += ' ' + p['addr:housenumber'];
  }
  if (!title) title = 'Edificio';

  h+='<div style="font-size:14px;font-weight:700;color:#d4c4a0;margin-bottom:2px">'+title+'</div>';

  // Type badge
  var typeLabel = p.building || p.amenity || p.tourism || p.shop || '';
  if (typeLabel && typeLabel !== 'yes')
    h+='<div style="font-size:9px;color:#8a7a60;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">'+typeLabel.replace(/_/g,' ')+'</div>';

  var height=parseFloat(p._h)||8;
  var floors=Math.round(height/3);
  var hasReal=parseInt(p['building:levels'])>0;
  if(hasReal)floors=parseInt(p['building:levels']);
  var est=hasReal?'':'<span style="color:#555;font-size:10px"> est.</span>';

  h+=row('Plantas',floors+est);
  h+=row('Altura',Math.round(height)+' m'+est);
  if(p['addr:street']&&p.name)h+=row('Calle',p['addr:street']+(p['addr:housenumber']?' '+p['addr:housenumber']:''));
  if(p._barrio)h+=row('Barrio',p._barrio);
  if(p._cusec)h+=row('Seccion',p._cusec);

  // Status
  h+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid #1e1e1e">';
  h+=row('Estado','<span style="color:#c47a5a">Sin digitalizar</span>');
  h+='</div>';

  // Action buttons
  h+='<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">';
  ['Identificar','Reclamar','Reportar'].forEach(function(label){
    h+='<span style="font-size:9px;padding:3px 8px;border-radius:4px;background:rgba(212,196,160,0.1);color:#d4c4a0;cursor:pointer;border:1px solid rgba(212,196,160,0.15);font-weight:600">'+label+'</span>';
  });
  h+='</div></div>';

  new maplibregl.Popup({maxWidth:'300px'}).setLngLat(e.lngLat).setHTML(h).addTo(map);
}

function row(label,value){
  return '<div style="display:flex;justify-content:space-between;color:#666;margin-bottom:2px;font-size:11px"><span>'+label+'</span><span style="color:#ccc;font-weight:500">'+value+'</span></div>';
}

// ========== NAV ==========
function goUp() {
  if(level==='seccion'&&activeDis)enterDistrito(activeDis);
  else if(level==='distrito')showCity();
}
function goDown() {
  // Down only works if we have a hovered/selected target — handled by click
}
function updateNavBtns() {
  document.getElementById('btn-up').disabled=(level==='city');
  document.getElementById('btn-down').disabled=true; // down is via click
}

// ========== HELPERS ==========
function setLayerVis(id,visible){
  if(map.getLayer(id))map.setLayoutProperty(id,'visibility',visible?'visible':'none');
}
function removeBuildings(){
  if(map.getLayer('buildings-shadow'))map.removeLayer('buildings-shadow');
  if(map.getLayer('buildings-3d'))map.removeLayer('buildings-3d');
  if(map.getLayer('buildings-outline'))map.removeLayer('buildings-outline');
  if(map.getLayer('buildings-label'))map.removeLayer('buildings-label');
  if(map.getLayer('sec-highlight'))map.removeLayer('sec-highlight');
  map.off('click','buildings-3d',buildingClick);
}
function getBounds(geometry){
  var minLng=180,maxLng=-180,minLat=90,maxLat=-90;
  function scan(coords){
    if(typeof coords[0]==='number'){
      if(coords[0]<minLng)minLng=coords[0];if(coords[0]>maxLng)maxLng=coords[0];
      if(coords[1]<minLat)minLat=coords[1];if(coords[1]>maxLat)maxLat=coords[1];
    }else{for(var i=0;i<coords.length;i++)scan(coords[i]);}
  }
  scan(geometry.coordinates);
  return[[minLng,minLat],[maxLng,maxLat]];
}

// ========== BREADCRUMB ==========
function updateBreadcrumb(){
  var bc=document.getElementById('breadcrumb');
  var parts=[];
  if(level==='city'){
    parts.push('<span class="active">Las Palmas de GC</span>');
  }else{
    parts.push('<span onclick="showCity()">Las Palmas de GC</span>');
    parts.push('<span class="sep">&#8250;</span>');
  }
  if(level==='distrito'){
    parts.push('<span class="active">D'+activeDis+' '+DIS_NAMES[activeDis]+'</span>');
  }else if(level==='seccion'){
    parts.push('<span onclick="enterDistrito(\''+activeDis+'\')">D'+activeDis+'</span>');
    parts.push('<span class="sep">&#8250;</span>');
    var sec=activeSec.slice(-3);
    var barrio='';
    SECCIONES.features.forEach(function(f){if(f.properties.cusec===activeSec)barrio=f.properties.barrio||'';});
    parts.push('<span class="active">S'+sec+(barrio?' · '+barrio:'')+'</span>');
  }
  bc.innerHTML=parts.join('');
}

// ========== DISTRICT LIST ==========
function renderDisList(activeDis){
  var el=document.getElementById('dis-list');
  if(level==='seccion'){el.innerHTML='';return;}
  var html='';
  ['01','02','03','04','05'].forEach(function(dis){
    var isActive=dis===activeDis;
    var border=isActive?'border-color:'+DIS_COLORS[dis]:'';
    var bg=isActive?'background:#1a1a1a':'';
    html+='<div class="dis-item" onclick="enterDistrito(\''+dis+'\')" style="'+border+';'+bg+'">';
    html+='<div class="dot" style="background:'+DIS_COLORS[dis]+'"></div>';
    html+='<div class="name">'+DIS_NAMES[dis]+'</div>';
    html+='<div class="count">'+DIS_SECCIONES[dis]+'</div>';
    html+='</div>';
  });
  el.innerHTML=html;
}

// ========== KEYBOARD ==========
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')goUp();
});
</script>
