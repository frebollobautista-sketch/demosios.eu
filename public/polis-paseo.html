<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>POLIS · Paseo (prototipo)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e0d0b0}
  #map{position:absolute;inset:0}
  .hud{position:absolute;pointer-events:none;z-index:10}
  .hud.tl{top:14px;left:14px}
  .hud.tr{top:14px;right:14px;text-align:right}
  .panel{
    background:rgba(20,18,15,0.86);
    border:1px solid rgba(212,196,160,0.25);
    border-radius:8px;
    padding:10px 14px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    pointer-events:auto;
  }
  .panel h1{margin:0 0 4px 0;font-size:13px;letter-spacing:.18em;color:#d4c4a0;font-weight:500;text-transform:uppercase}
  .panel .sub{margin:0;font-size:11px;color:#8a8070;letter-spacing:.05em}
  .keys{display:grid;grid-template-columns:repeat(3,28px);grid-template-rows:repeat(2,28px);gap:3px;margin-top:8px}
  .key{
    background:rgba(40,36,30,.9);
    border:1px solid rgba(212,196,160,.3);
    border-radius:5px;
    text-align:center;
    line-height:26px;
    font-size:11px;
    color:#d4c4a0;
    font-weight:600;
    transition:all .08s
  }
  .key.active{background:#d4c4a0;color:#1a1612;border-color:#d4c4a0}
  .key.empty{visibility:hidden}
  .stats{font-size:11px;line-height:1.6;color:#a89c80}
  .stats b{color:#d4c4a0;font-weight:500}
  .crosshair{
    position:absolute;left:50%;top:50%;width:6px;height:6px;
    margin:-3px 0 0 -3px;
    border-radius:50%;
    background:rgba(255,232,160,.6);
    box-shadow:0 0 0 2px rgba(0,0,0,.3),0 0 12px rgba(255,232,160,.4);
    z-index:5;
    pointer-events:none;
  }
  .joystick{
    position:absolute;bottom:24px;left:24px;width:120px;height:120px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(40,36,30,.7) 0%,rgba(20,18,15,.4) 70%);
    border:2px solid rgba(212,196,160,.3);
    z-index:8;
    display:none;
    touch-action:none;
  }
  .joystick.active{display:block}
  .joystick .nub{
    position:absolute;left:50%;top:50%;width:48px;height:48px;
    margin:-24px 0 0 -24px;
    border-radius:50%;
    background:rgba(212,196,160,.85);
    box-shadow:0 4px 12px rgba(0,0,0,.4);
    pointer-events:none;
  }
  .popup-info{font-size:12px;line-height:1.5}
  .popup-info b{color:#d4c4a0}
  .maplibregl-popup-content{
    background:rgba(20,18,15,0.92);
    color:#d0c4a0;
    border:1px solid rgba(212,196,160,.3);
    border-radius:6px;
    padding:10px 12px;
  }
  .maplibregl-popup-tip{border-top-color:rgba(20,18,15,0.92) !important}
  .loading{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(20,18,15,.92);
    border:1px solid rgba(212,196,160,.3);
    padding:14px 20px;border-radius:8px;
    z-index:20;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#d4c4a0
  }
  @media (max-width:720px){
    .hud.tr{display:none}
    .joystick{display:block}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="crosshair"></div>

<div class="hud tl">
  <div class="panel">
    <h1>POLIS · Paseo</h1>
    <p class="sub" id="loc-name">Vegueta · LPGC</p>
    <div class="keys">
      <div class="key empty"></div>
      <div class="key" id="k-w">W</div>
      <div class="key empty"></div>
      <div class="key" id="k-a">A</div>
      <div class="key" id="k-s">S</div>
      <div class="key" id="k-d">D</div>
    </div>
    <p class="sub" style="margin-top:6px">Q/E · girar · SHIFT · correr</p>
  </div>
</div>

<div class="hud tr">
  <div class="panel stats" id="stats"></div>
</div>

<div class="joystick" id="joystick"><div class="nub" id="nub"></div></div>
<div class="loading" id="loading">Cargando barrio…</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* POLIS · Paseo — prototipo Pokémon Go style.
   Carga distrito 01 LPGC (Vegueta/Triana/Centro) — 58 secciones, ~13.5k edificios.
   Avatar = círculo amarillo. WASD/flechas mueve, Q/E gira, SHIFT corre. */

var DISTRITO_PREFIX = '3501601';
var START_POS = [-15.4163, 28.0985];
var BASE_SPEED = 0.0000015;
var RUN_MULT = 2.4;
var ROTATE_SPEED = 0.18;
var CAM_PITCH = 60;
var CAM_ZOOM = 18.2;

var map;
var avatarLngLat = START_POS.slice();
var bearing = 0;
var keys = {};
var lastFrame = 0;
var totalBuildings = 0;
var loadedSections = 0;

map = new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      'esri-satellite':{
        type:'raster',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize:256,
        attribution:'Esri'
      },
      'terrain-dem':{
        type:'raster-dem',
        tiles:['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
        tileSize:256,
        encoding:'terrarium',
        maxzoom:15
      }
    },
    layers:[
      {id:'sat',type:'raster',source:'esri-satellite'},
      {id:'hill',type:'hillshade',source:'terrain-dem',paint:{'hillshade-exaggeration':.45,'hillshade-shadow-color':'#1a1410','hillshade-highlight-color':'#fff8e8','hillshade-accent-color':'#5a4030'}}
    ],
    light:{anchor:'viewport',color:'#ffe8c0',intensity:0.55,position:[1.5,210,30]}
  },
  center: START_POS, zoom: CAM_ZOOM, pitch: CAM_PITCH, bearing: 0,
  attributionControl:false,
  interactive:false
});

function listSections(){
  var ids = [];
  var skipped = {2:1, 9:1, 16:1, 22:1, 28:1};
  for(var i=1; i<=63; i++){
    if(skipped[i]) continue;
    ids.push(DISTRITO_PREFIX + String(i).padStart(3,'0'));
  }
  return ids;
}

function loadAllBuildings(){
  var ids = listSections();
  var allFeatures = [];
  var fid = 0;
  var done = 0;
  var total = ids.length;

  ids.forEach(function(cusec){
    fetch('buildings/' + cusec + '.json').then(function(r){
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(raw){
      raw.forEach(function(b){
        allFeatures.push({
          type:'Feature', id:fid++,
          geometry:{type:'Polygon',coordinates:[b[0]]},
          properties:{_h:b[1], _cusec:cusec, _id:fid}
        });
      });
      done++;
      loadedSections = done;
      document.getElementById('loading').textContent = 'Cargando barrio… ' + done + '/' + total;
      if(done === total){
        totalBuildings = allFeatures.length;
        renderBuildings(allFeatures);
        document.getElementById('loading').style.display = 'none';
      }
    }).catch(function(){
      done++;
      if(done === total && allFeatures.length){
        totalBuildings = allFeatures.length;
        renderBuildings(allFeatures);
        document.getElementById('loading').style.display = 'none';
      }
    });
  });
}

function renderBuildings(features){
  var shadows = features.map(function(f){
    var h = f.properties._h || 8;
    var coords = f.geometry.coordinates[0].map(function(c){
      return [c[0]+h*0.000004, c[1]-h*0.000003];
    });
    return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{_h:h}};
  });
  map.addSource('bld-shadow',{type:'geojson',data:{type:'FeatureCollection',features:shadows}});
  map.addLayer({
    id:'bld-shadow',type:'fill',source:'bld-shadow',
    paint:{'fill-color':'#000','fill-opacity':['interpolate',['linear'],['get','_h'],3,0.10,8,0.18,15,0.28,25,0.35]}
  });

  map.addSource('buildings',{type:'geojson',data:{type:'FeatureCollection',features:features}});
  map.addLayer({
    id:'buildings-3d',type:'fill-extrusion',source:'buildings',
    paint:{
      'fill-extrusion-color':['case',['boolean',['feature-state','hover'],false],'#f0e0c0','#c8b898'],
      'fill-extrusion-height':['get','_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.92,
      'fill-extrusion-vertical-gradient':true
    }
  });

  var hov = null;
  map.on('mousemove','buildings-3d',function(e){
    if(!e.features.length) return;
    map.getCanvas().style.cursor='pointer';
    if(hov!==null) map.setFeatureState({source:'buildings',id:hov},{hover:false});
    hov = e.features[0].id;
    map.setFeatureState({source:'buildings',id:hov},{hover:true});
  });
  map.on('mouseleave','buildings-3d',function(){
    map.getCanvas().style.cursor='';
    if(hov!==null){map.setFeatureState({source:'buildings',id:hov},{hover:false});hov=null;}
  });
  map.on('click','buildings-3d',function(e){
    var f = e.features[0];
    new maplibregl.Popup({closeButton:true,offset:8})
      .setLngLat(e.lngLat)
      .setHTML('<div class="popup-info"><b>Edificio</b><br>Altura: '+(f.properties._h||0).toFixed(1)+' m<br>Sección: '+f.properties._cusec+'</div>')
      .addTo(map);
  });

  map.addSource('avatar',{type:'geojson',data:avatarFeature()});
  map.addLayer({
    id:'avatar-glow',type:'circle',source:'avatar',
    paint:{'circle-radius':24,'circle-color':'#ffe8a0','circle-blur':1.2,'circle-opacity':0.5}
  });
  map.addLayer({
    id:'avatar-dot',type:'circle',source:'avatar',
    paint:{
      'circle-radius':9,'circle-color':'#ffd76a',
      'circle-stroke-color':'#1a1612','circle-stroke-width':2.5,
      'circle-pitch-alignment':'map'
    }
  });
  map.addSource('avatar-dir',{type:'geojson',data:avatarDirFeature()});
  map.addLayer({
    id:'avatar-dir',type:'line',source:'avatar-dir',
    paint:{'line-color':'#ffe89a','line-width':3,'line-opacity':0.85}
  });

  applyCamera(true);
}

function avatarFeature(){
  return {type:'Feature',geometry:{type:'Point',coordinates:avatarLngLat},properties:{}};
}
function avatarDirFeature(){
  var fwd = forwardOffset(bearing, 0.00006);
  return {type:'Feature',geometry:{type:'LineString',coordinates:[avatarLngLat,[avatarLngLat[0]+fwd[0], avatarLngLat[1]+fwd[1]]]},properties:{}};
}

function forwardOffset(deg, mag){
  var rad = deg * Math.PI/180;
  var dy = Math.cos(rad) * mag;
  var dx = Math.sin(rad) * mag;
  var latCos = Math.cos(avatarLngLat[1]*Math.PI/180);
  return [dx/latCos, dy];
}

function applyCamera(jump){
  if(jump){
    map.jumpTo({center: avatarLngLat, bearing: bearing, pitch: CAM_PITCH, zoom: CAM_ZOOM});
  } else {
    map.jumpTo({center: avatarLngLat, bearing: bearing});
  }
}

function tick(t){
  if(!lastFrame) lastFrame = t;
  var dt = t - lastFrame;
  lastFrame = t;

  if(map.getSource('avatar')){
    var speed = BASE_SPEED * dt * (keys.shift ? RUN_MULT : 1);
    var moved = false;

    if(keys.w || keys.up){
      var f = forwardOffset(bearing, speed);
      avatarLngLat[0] += f[0]; avatarLngLat[1] += f[1]; moved = true;
    }
    if(keys.s || keys.down){
      var f = forwardOffset(bearing, -speed);
      avatarLngLat[0] += f[0]; avatarLngLat[1] += f[1]; moved = true;
    }
    if(keys.a){
      var f = forwardOffset(bearing-90, speed);
      avatarLngLat[0] += f[0]; avatarLngLat[1] += f[1]; moved = true;
    }
    if(keys.d){
      var f = forwardOffset(bearing+90, speed);
      avatarLngLat[0] += f[0]; avatarLngLat[1] += f[1]; moved = true;
    }
    if(keys.q || keys.left){ bearing -= ROTATE_SPEED * dt; moved = true; }
    if(keys.e || keys.right){ bearing += ROTATE_SPEED * dt; moved = true; }

    if(moved){
      map.getSource('avatar').setData(avatarFeature());
      map.getSource('avatar-dir').setData(avatarDirFeature());
      applyCamera(false);
    }
  }

  updateStats();
  requestAnimationFrame(tick);
}

function updateStats(){
  var el = document.getElementById('stats');
  if(!el) return;
  el.innerHTML =
    '<b>Ubicación</b><br>' +
    avatarLngLat[1].toFixed(5) + ', ' + avatarLngLat[0].toFixed(5) + '<br>' +
    '<b>Bearing</b> ' + (((bearing%360)+360)%360).toFixed(0) + '°<br>' +
    '<b>Edificios</b> ' + totalBuildings + '<br>' +
    '<b>Secciones</b> ' + loadedSections;
}

function setKey(k, val){
  keys[k] = val;
  var el = document.getElementById('k-'+k);
  if(el) el.classList.toggle('active', val);
}
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); }
  if(k==='shift'){ keys.shift = true; return; }
  if(k==='arrowup'){ setKey('w', true); keys.up=true; return; }
  if(k==='arrowdown'){ setKey('s', true); keys.down=true; return; }
  if(k==='arrowleft'){ setKey('a', true); keys.left=true; return; }
  if(k==='arrowright'){ setKey('d', true); keys.right=true; return; }
  setKey(k, true);
});
window.addEventListener('keyup', function(e){
  var k = e.key.toLowerCase();
  if(k==='shift'){ keys.shift = false; return; }
  if(k==='arrowup'){ setKey('w', false); keys.up=false; return; }
  if(k==='arrowdown'){ setKey('s', false); keys.down=false; return; }
  if(k==='arrowleft'){ setKey('a', false); keys.left=false; return; }
  if(k==='arrowright'){ setKey('d', false); keys.right=false; return; }
  setKey(k, false);
});

(function(){
  var js = document.getElementById('joystick'), nub = document.getElementById('nub');
  var center = null, active = false;
  function onStart(e){
    e.preventDefault();
    var t = e.touches ? e.touches[0] : e;
    var r = js.getBoundingClientRect();
    center = {x:r.left+r.width/2, y:r.top+r.height/2};
    active = true;
  }
  function onMove(e){
    if(!active) return;
    var t = e.touches ? e.touches[0] : e;
    var dx = t.clientX - center.x, dy = t.clientY - center.y;
    var d = Math.min(Math.hypot(dx,dy), 40);
    var a = Math.atan2(dy, dx);
    nub.style.transform = 'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px)';
    keys.w = dy < -10;
    keys.s = dy > 10;
    keys.a = dx < -10;
    keys.d = dx > 10;
  }
  function onEnd(){
    active = false;
    nub.style.transform = '';
    keys.w = keys.s = keys.a = keys.d = false;
  }
  js.addEventListener('touchstart', onStart);
  js.addEventListener('touchmove', onMove);
  js.addEventListener('touchend', onEnd);
})();

map.on('load', function(){
  loadAllBuildings();
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
