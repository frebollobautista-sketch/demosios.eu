<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=/polis-app/">
<meta name="robots" content="noindex">
<link rel="canonical" href="/polis-app/">
<title>OCRE · POLIS</title>
<style>
  body { font-family: Georgia, serif; background:#F5E8C8; color:#3D2317;
         display:flex; align-items:center; justify-content:center;
         height:100vh; margin:0; }
  .card { max-width: 420px; padding: 32px; text-align: center;
          background: #FAEFD3; border: 2px solid #3D2317;
          box-shadow: 4px 4px 0 #3D2317; }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.5px; }
  p  { margin: 8px 0 16px; line-height: 1.5; }
  a  { color: #A0522D; text-decoration: underline; font-weight: 600; }
</style>
<script>
  // Propaga querystring al destino. Si llegan ?isla=tf&mun=038, aterrizan
  // en /polis-app/?isla=tf&mun=038.
  (function () {
    var qs = location.search || "";
    var hash = location.hash || "";
    location.replace("/polis-app/" + qs + hash);
  })();
</script>
</head>
<body>
  <div class="card">
    <h1>OCRE · POLIS</h1>
    <p>Llevándote al nuevo visor del territorio…</p>
    <p><a href="/polis-app/">Pulsa aquí si no carga automáticamente</a>.</p>
  </div>
</body>
</html>
