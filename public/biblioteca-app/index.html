<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Biblioteca — feed formativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260531-nosliders">
  <link rel="stylesheet" href="sillas-conocimiento.css?v=20260531-unifyheader">
  <link rel="stylesheet" href="quorums-lectura.css?v=20260531-unifyheader">
  <link rel="stylesheet" href="pulso-palacios.css?v=20260531-unifyheader">
  <link rel="stylesheet" href="descubre.css?v=20260531-unifyheader">
</head>
<body>
  <!-- [INDIGO-SKIN 2026-05-29] Header OCRE portado de POLIS (mismo shell que
       agora-app, ver IDEAS.md "Tablero de aficiones"). Skin índigo: papel
       índigo oscuro / tinta clara / acento azul-pizarra + oro PHAROS. -->
  <div class="biblio-topshell">
    <header class="app-topbar" id="app-topbar">
      <div class="app-topbar-left">
        <div class="app-topbar-brand">
          <span class="brand-icon" aria-hidden="true"></span>
          <span class="brand-text">OCRE</span>
        </div>
        <code id="uid" class="topbar-uid-code" hidden></code>
      </div>

      <!-- [2026-05-31] Toggle segmentado idéntico a POLIS: icono+label por
           sección, color identidad (POLIS azul, ÁGORA rojo, BIBLIOTHEKA
           verde). El segmento activo se rellena con su color. -->
      <nav class="app-pillars" aria-label="Saltar entre pilares" role="tablist">
        <a class="pillar pillar-polis" href="../polis-app/index.html" role="tab">
          <span class="pillar-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 2 1 8h22z"/>
              <rect fill="currentColor" x="2" y="8.6" width="20" height="1.6"/>
              <rect fill="currentColor" x="3"    y="11" width="2.4" height="8"/>
              <rect fill="currentColor" x="8"    y="11" width="2.4" height="8"/>
              <rect fill="currentColor" x="13.2" y="11" width="2.4" height="8"/>
              <rect fill="currentColor" x="18.6" y="11" width="2.4" height="8"/>
              <rect fill="currentColor" x="1" y="20" width="22" height="2"/>
            </svg>
          </span>
          <span class="pillar-label">POLIS</span>
        </a>
        <a class="pillar pillar-agora" href="../agora-app/index.html" role="tab">
          <span class="pillar-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M2 4h12a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7l-3 3v-3H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
              <path fill="currentColor" opacity="0.8" d="M22 9h-3v2a3 3 0 0 1-3 3h-4a2 2 0 0 0 2 2h4l3 3v-3a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2z"/>
            </svg>
          </span>
          <span class="pillar-label">ÁGORA</span>
        </a>
        <a class="pillar pillar-biblioteca is-active" href="../biblioteca-app/index.html" aria-current="page" role="tab">
          <span class="pillar-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M3 5c2.8-1 5.7-1 9 .6 3.3-1.6 6.2-1.6 9-.6v13.5c-2.8-1-5.7-1-9 .5-3.3-1.5-6.2-1.5-9-.5z"/>
              <rect fill="var(--paper-app)" x="11.4" y="6.2" width="1.2" height="12.4"/>
            </svg>
          </span>
          <span class="pillar-label">BIBLIOTHEKA</span>
        </a>
      </nav>

      <div class="app-topbar-right">
        <button id="btn-descubre" class="app-topbar-iconbtn" type="button"
                aria-label="Descubre" title="Descubre una idea — modo serendípico formativo">✦</button>
        <button id="btn-nueva-sintesis" class="app-topbar-iconbtn" type="button"
                aria-label="Síntesis" title="Crear síntesis (G2)">✎</button>
        <button id="btn-nueva-mision" class="app-topbar-enter primary" type="button">+ Misión</button>
      </div>
    </header>

    <!-- Tira "multitouch": placeholder por ahora (banda visual continua con
         el header). Cuando biblioteca defina sus ejes de contexto
         (secciones PHAROS / grados del cursus / temas mnemoHACK), van aquí. -->
    <div id="biblio-strip" class="biblio-strip" role="tablist" aria-label="Biblioteca"></div>
  </div>

  <!-- [2026-05-31] Avatar del cursus honorum: círculo flotante abajo a la
       derecha con "?" mientras no hay registro (idéntico a POLIS y ÁGORA). -->
  <button class="app-avatar-fab" id="app-topbar-enter" type="button"
          aria-label="Mi perfil — sin registrar" title="Entrar / registrarme"
          data-registered="false">
    <svg class="ava-ico" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <circle fill="currentColor" cx="12" cy="8" r="4.2"/>
      <path fill="currentColor" d="M3.5 21c0-4.5 3.8-7.2 8.5-7.2s8.5 2.7 8.5 7.2z"/>
    </svg>
    <span class="ava-badge" aria-hidden="true">?</span>
  </button>

  <main class="app">

    <!-- Columna centro: feed -->
    <section class="feed">
      <div class="feed-header">
        <h2>Feed</h2>
        <span class="feed-stats" id="feed-stats">…</span>
      </div>
      <div id="feed" aria-live="polite"><!-- cards --></div>
      <!-- Vacío como invitación: app.js lo muestra cuando ranked.length===0 -->
      <div id="feed-empty" class="feed-empty" hidden></div>
    </section>

    <!-- Columna derecha: misiones + honesty -->
    <aside class="col right" aria-label="Misiones y honesty meter">
      <div class="misiones-head">
        <h2>Misiones</h2>
      </div>
      <div class="mision-list" id="mision-list">
        <!-- pintado por app.js -->
      </div>

      <div class="sintesis-cta">
        <button id="btn-nueva-sintesis-side" onclick="document.getElementById('btn-nueva-sintesis').click()">
          ✎ Crear síntesis (G2)
        </button>
      </div>

      <div class="honesty" id="honesty">
        <!-- pintado por app.js -->
      </div>

      <!-- Acciones masa crítica v3 -->
      <div class="biblio-actions">
        <button id="btn-abrir-pulso-palacios" class="btn-ghost-wide" type="button">
          📡 Pulso de palacios (30d)
        </button>
        <button id="btn-nuevo-quorum-lectura" class="btn-ghost-wide" type="button">
          ▸ Convocar lectura
        </button>
      </div>

      <div class="tokens-block" id="tokens-block"></div>
    </aside>

  </main>

  <!-- Modal de quórum de lectura -->
  <div class="modal-backdrop" id="modal-quorum-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-quorum-title">
      <h2 id="modal-quorum-title">Convocar lectura conjunta</h2>
      <p class="modal-hint">
        Una lectura se "abre" cuando alcanza N personas antes de la fecha.
        Sin urgencia: si no llega, vuelve como propuesta archivada.
      </p>
      <label>Título <input id="ql-titulo" type="text" maxlength="120" required placeholder="Leer 'Republicanismo' (Pettit)"></label>
      <label>Autor / fuente
        <input id="ql-autor" type="text" maxlength="120" placeholder="Pettit, 1997">
      </label>
      <label>Descripción (opcional)
        <textarea id="ql-descripcion" maxlength="280" rows="2"></textarea>
      </label>
      <div style="display:flex; gap:0.6rem;">
        <label style="flex:1;">Personas necesarias
          <input id="ql-umbral" type="number" min="2" max="100" value="6" required>
        </label>
        <label style="flex:1;">Deadline (cierre)
          <input id="ql-deadline" type="date" required>
        </label>
      </div>
      <label>Fecha de inicio de la lectura
        <input id="ql-fecha-evento" type="date">
      </label>
      <label>Tema mnemoHACK relacionado (opcional)
        <input id="ql-tema" type="text" maxlength="10" placeholder="t14">
      </label>
      <div class="modal-actions">
        <button class="btn-cancel" id="ql-cancel" type="button">cancelar</button>
        <button class="btn-confirm" id="ql-confirm" type="button">convocar lectura</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js?v=20260601-perfil1"></script>
</body>
</html>
