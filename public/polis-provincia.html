<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOINOS POLIS — Provincia de Las Palmas</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,sans-serif}
#map{width:100%;height:100vh}

/* ===== ISLAND NAV — top center, outline only ===== */
.island-nav{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;
  pointer-events:none;
}
.island-nav svg{display:block;pointer-events:all}
.island-nav path{
  fill:none;stroke:rgba(180,160,110,0.18);stroke-width:0.6;
  cursor:pointer;transition:fill .2s,stroke .2s,stroke-width .2s;
}
.island-nav path.active{stroke:rgba(212,196,160,0.35);stroke-width:0.7}
.island-nav path:hover{fill:rgba(212,196,160,0.12);stroke:rgba(212,196,160,0.55);stroke-width:0.9}
.island-nav path.current{fill:rgba(212,196,160,0.1);stroke:rgba(212,196,160,0.7);stroke-width:1.1}
.island-nav .island-tooltip{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;color:rgba(212,196,160,0.7);white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;
  font-family:system-ui,sans-serif;letter-spacing:0.5px;
}
.island-nav.show-tip .island-tooltip{opacity:1}

/* ===== NOTEBOOK PANEL ===== */
.notebook{
  position:fixed;top:10px;left:10px;z-index:10;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}

/* Cover (closed state) */
.notebook-cover{
  width:44px;height:140px;
  background:linear-gradient(135deg,#1a1610 0%,#15120e 50%,#1a1610 100%);
  border:1px solid #2a2520;border-radius:3px 8px 8px 3px;
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:2px 2px 12px rgba(0,0,0,0.5);
  transition:all .25s;
}
.notebook-cover:hover{border-color:#3a3530;box-shadow:2px 2px 16px rgba(0,0,0,0.6)}
/* Spine line */
.notebook-cover::before{
  content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(212,196,160,0.12),rgba(212,196,160,0.15),rgba(212,196,160,0.12),transparent);
}
/* Embossed title */
.notebook-cover .cover-title{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  white-space:nowrap;font-size:8px;letter-spacing:2px;
  color:rgba(212,196,160,0.25);font-weight:700;
  text-transform:uppercase;
}

/* Open state */
.notebook.open .notebook-cover{display:none}
.notebook-page{
  display:none;width:300px;
  background:linear-gradient(135deg,#141210 0%,#121010 40%,#151311 100%);
  border:1px solid #2a2520;border-radius:3px 10px 10px 3px;
  position:relative;overflow:hidden;
  box-shadow:3px 3px 20px rgba(0,0,0,0.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.notebook.open .notebook-page{display:block}
/* Spine */
.notebook-page::before{
  content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(212,196,160,0.08),rgba(212,196,160,0.1),rgba(212,196,160,0.08),transparent);
}
.notebook-page-inner{
  padding:14px 14px 14px 18px;
  background:linear-gradient(180deg,rgba(20,18,14,0.3) 0%,transparent 30%);
}

/* Close button */
.notebook-close{
  position:absolute;top:6px;right:8px;z-index:2;
  background:none;border:none;color:rgba(212,196,160,0.3);font-size:14px;
  cursor:pointer;transition:color .15s;line-height:1;
}
.notebook-close:hover{color:rgba(212,196,160,0.6)}

.notebook h1{font-size:14px;color:#d4c4a0;letter-spacing:1px;margin-bottom:2px;font-weight:700}
.notebook .sub{color:#555;font-size:9px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}

.breadcrumb{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.breadcrumb span{
  background:#1a1a1a;padding:3px 8px;border-radius:4px;font-size:10px;
  cursor:pointer;border:1px solid #222;transition:all .15s;color:#888;
}
.breadcrumb span:hover{background:#222;border-color:#444;color:#ddd}
.breadcrumb span.active{background:#d4c4a0;color:#111;font-weight:600;border-color:#d4c4a0;cursor:default}
.breadcrumb span.sep{background:none;border:none;color:#444;cursor:default;padding:3px 2px}

.stats{font-size:10px;color:#777;line-height:1.7;margin-top:6px}
.stats b{color:#d4c4a0}

.mun-list{margin-top:6px;max-height:300px;overflow-y:auto}
.mun-item{
  padding:5px 8px;border-radius:5px;font-size:10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;margin-bottom:1px;
  background:transparent;border:1px solid transparent;transition:all .12s;
}
.mun-item:hover{background:#1a1a1a;border-color:#2a2a2a}
.mun-item.active{background:#1a1a1a;border-color:#d4c4a0}
.mun-item .name{color:#aaa;flex:1}
.mun-item .count{color:#444;font-size:9px}

/* ===== ALL BUILDINGS TOGGLE ===== */
.all-buildings-toggle{
  margin-top:8px;padding:6px 10px;border-radius:6px;
  background:#1a1a1a;border:1px solid #2a2520;
  cursor:pointer;display:none;align-items:center;gap:8px;
  font-size:10px;color:#888;transition:all .15s;
}
.all-buildings-toggle:hover{background:#222;border-color:#444;color:#ccc}
.all-buildings-toggle.active{border-color:#d4c4a0;color:#d4c4a0}
.all-buildings-toggle .toggle-switch{
  width:28px;height:14px;border-radius:7px;
  background:#333;position:relative;transition:background .2s;flex-shrink:0;
}
.all-buildings-toggle.active .toggle-switch{background:#5a5040}
.all-buildings-toggle .toggle-switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:10px;height:10px;border-radius:50%;
  background:#888;transition:all .2s;
}
.all-buildings-toggle.active .toggle-switch::after{left:16px;background:#d4c4a0}

.loading{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(10,10,10,0.94);color:#d4c4a0;padding:6px 14px;border-radius:8px;
  font-size:10px;font-weight:600;display:none;border:1px solid rgba(212,196,160,0.15);
}
.loading.on{display:block}

.maplibregl-popup-content{
  background:rgba(12,12,12,0.97)!important;border:1px solid rgba(212,196,160,0.15)!important;
  border-radius:10px!important;color:#e0e0e0!important;padding:0!important;
  backdrop-filter:blur(10px)!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;
}
.maplibregl-popup-tip{border-top-color:rgba(12,12,12,0.97)!important}
.maplibregl-popup-close-button{color:#888!important;font-size:16px!important}
</style>
</head>

</div>

(function(){
  var svg = document.getElementById('island-svg');
  var tooltip = document.getElementById('island-tooltip');
  var navContainer = document.getElementById('island-nav');

  ISLAND_NAV.forEach(function(isl){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', isl.d);
    path.setAttribute('data-island', isl.name);
    if(isl.active) path.classList.add('active');

    path.addEventListener('mouseenter', function(){
      tooltip.textContent = isl.name;
      navContainer.classList.add('show-tip');
    });
    path.addEventListener('mouseleave', function(){
      navContainer.classList.remove('show-tip');
    });

    path.addEventListener('click', function(){
      // Fly to island — no showProvincia, just smooth fly
      map.flyTo({center:isl.center, zoom:isl.zoom, pitch:0, bearing:0, duration:1200, essential:true});
      // Update current highlight
      svg.querySelectorAll('path').forEach(function(p){p.classList.remove('current');});
      path.classList.add('current');
    });
    svg.appendChild(path);
  });
})();

var RENTA_DATA = null;

// ===== OSM DATA LOADING =====
function loadOSMLayers() {
  var fileLayers = DATA_LAYERS.filter(function(l){return l.file;});
  fileLayers.forEach(function(layer) {
    fetchWithFallback(layer.file, layer.fallback).then(function(result) {
      layer.data = result.data;
      layer.loaded = true;
      layer.coverage = result.source === layer.file ? 'Prov. 35' : 'LPGC';

      if (layer.id === 'renta') {
        RENTA_DATA = result.data;
        layer.coverage = Object.keys(result.data).length + ' secciones';
        console.log('Renta loaded: ' + Object.keys(result.data).length + ' sections');
      } else {
        setupOSMLayer(layer, result.data);
        console.log('Loaded ' + layer.id + ' (' + layer.coverage + '): ' + (result.data.features ? result.data.features.length : '?') + ' features');
      }
    }).catch(function(e) {
      console.warn('Could not load ' + layer.id + ':', e.message);
    });
  });
}

function fetchWithFallback(primary, fallback) {
  return fetch(primary).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.json().then(function(data) { return {data:data, source:primary}; });
  }).catch(function() {
    if (!fallback) throw new Error('No fallback');
    return fetch(fallback).then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json().then(function(data) { return {data:data, source:fallback}; });
    });
  });
}

function setupOSMLayer(layer, data) {
  var id = layer.id;
  if (map.getSource(id)) return;

  if (id === 'osm-roads') {
    map.addSource(id, {type:'geojson', data:data});
    map.addLayer({
      id:id, type:'line', source:id,
      paint:{
        'line-color':['match',['get','highway'],'primary','#5a5040','secondary','#4a4030','#3a3528'],
        'line-width':['interpolate',['linear'],['zoom'],
          12,['match',['get','highway'],'primary',1.5,'secondary',1,0],
          14,['match',['get','highway'],'primary',3,'secondary',2.2,'tertiary',1.5,'residential',0.8,0.5],
          17,['match',['get','highway'],'primary',5,'secondary',3.5,'tertiary',2.5,'residential',1.2,0.6]
        ],
        'line-opacity':['interpolate',['linear'],['zoom'],12,0.3,14,0.5,16,0.6]
      },
      minzoom:12
    }, 'labels');
  } else if (id === 'osm-parks') {
    var polys = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Polygon';})};
    map.addSource(id, {type:'geojson', data:polys});
    map.addLayer({
      id:id, type:'fill', source:id,
      paint:{'fill-color':'#2a5a18','fill-opacity':['interpolate',['linear'],['zoom'],12,0.25,16,0.5]},
      minzoom:12
    }, 'labels');
  } else if (id === 'osm-coast') {
    map.addSource(id, {type:'geojson', data:data});
    map.addLayer({
      id:id, type:'line', source:id,
      paint:{'line-color':'#2a6a9a','line-width':['interpolate',['linear'],['zoom'],11,1.5,16,3],'line-opacity':0.6},
      minzoom:11
    }, 'labels');
  } else if (id === 'osm-water') {
    var polys = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Polygon';})};
    map.addSource(id, {type:'geojson', data:polys});
    map.addLayer({
      id:id, type:'fill', source:id,
      paint:{'fill-color':'#1a4a6a','fill-opacity':['interpolate',['linear'],['zoom'],13,0.3,16,0.5]},
      minzoom:13
    }, 'labels');
  } else if (id === 'osm-pois') {
    var pts = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Point'&&f.properties.name;})};
    map.addSource(id, {type:'geojson', data:pts});
    map.addLayer({
      id:id, type:'circle', source:id,
      paint:{'circle-radius':['interpolate',['linear'],['zoom'],14,1.5,16,3],'circle-color':'#d4c4a0','circle-opacity':0.6,'circle-stroke-width':0.5,'circle-stroke-color':'#0a0a0a'},
      minzoom:14
    });
    map.addLayer({
      id:id+'-label', type:'symbol', source:id,
      layout:{'text-field':['get','name'],'text-size':9,'text-offset':[0.8,0],'text-anchor':'left','text-allow-overlap':false},
      paint:{'text-color':'#b0a080','text-halo-color':'rgba(0,0,0,0.7)','text-halo-width':1},
      minzoom:15
    });
  }
}

// ===== SECCIONES LAYER =====
function setupSeccionesLayer() {
  SECCIONES.features.forEach(function(f,i){ f.id = i; });
  map.addSource('secciones', {type:'geojson', data:SECCIONES});

  map.addLayer({
    id:'secciones-fill', type:'fill', source:'secciones',
    paint:{
      'fill-color':'#d4c4a0',
      'fill-opacity':['case',['boolean',['feature-state','hover'],false],0.2,0]
    }
  });
  map.addLayer({
    id:'secciones-line', type:'line', source:'secciones',
    paint:{
      'line-color':'#d4c4a0',
      'line-width':['case',['boolean',['feature-state','hover'],false],1.5,0.3],
      'line-opacity':['case',['boolean',['feature-state','hover'],false],0.6,0]
    }
  });

  var hovId = null;
  var rentaPopup = null;
  map.on('mousemove','secciones-fill',function(e){
    if(!e.features.length) return;
    map.getCanvas().style.cursor = 'pointer';
    if(hovId !== null) map.setFeatureState({source:'secciones',id:hovId},{hover:false});
    hovId = e.features[0].id;
    map.setFeatureState({source:'secciones',id:hovId},{hover:true});
    // Renta tooltip
    if(rentaVisible && RENTA_DATA) {
      var cusec = e.features[0].properties.cusec;
      var r = RENTA_DATA[cusec];
      if(r) {
        var html = '<div style="padding:6px 10px;font-size:11px"><b style="color:#d4c4a0">'+e.features[0].properties.nmun+'</b> S'+cusec.slice(-3)+'<br><span style="color:#ccc;font-size:13px;font-weight:700">'+r.renta.toLocaleString('es')+'€</span> <span style="color:#666">renta media/persona</span></div>';
        if(!rentaPopup) rentaPopup = new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:'200px',offset:10});
        rentaPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      } else if(rentaPopup) { rentaPopup.remove(); rentaPopup=null; }
    }
  });
  map.on('mouseleave','secciones-fill',function(){
    map.getCanvas().style.cursor = '';
    if(hovId !== null){map.setFeatureState({source:'secciones',id:hovId},{hover:false});hovId=null;}
    if(rentaPopup){rentaPopup.remove();rentaPopup=null;}
  });

  map.on('click','secciones-fill',function(e){
    if(!e.features.length) return;
    var p = e.features[0].properties;
    if(level === 'provincia') {
      enterMunicipio(p.mun);
    } else if(level === 'municipio') {
      enterSeccion(p.cusec, p.mun);
    } else if(level === 'seccion' && p.cusec !== activeSec) {
      enterSeccion(p.cusec, p.mun);
    }
  });
}

// ===== RENTA LAYER =====
function toggleRenta() {
  if (!RENTA_DATA) return;
  rentaVisible = !rentaVisible;

  if (rentaVisible) {
    var rentas = Object.values(RENTA_DATA).map(function(r){return r.renta;}).sort(function(a,b){return a-b;});
    var p20 = rentas[Math.floor(rentas.length*0.2)] || 7000;
    var p50 = rentas[Math.floor(rentas.length*0.5)] || 10000;
    var p80 = rentas[Math.floor(rentas.length*0.8)] || 14000;
    window._rentaBreaks = {p20:p20, p50:p50, p80:p80};

    SECCIONES.features.forEach(function(f) {
      var cusec = f.properties.cusec;
      var r = RENTA_DATA[cusec];
      if (r) {
        map.setFeatureState({source:'secciones', id:f.id}, {renta: r.renta, hasRenta: true});
      }
    });

    map.setPaintProperty('secciones-fill','fill-color',[
      'case',
      ['boolean',['feature-state','hasRenta'],false],
      ['interpolate',['linear'],['feature-state','renta'],
        p20, '#c45a4a',
        p50, '#d4c44a',
        p80, '#4aaa5a'
      ],
      'rgba(0,0,0,0)'
    ]);
    map.setPaintProperty('secciones-fill','fill-opacity',[
      'case',
      ['boolean',['feature-state','hasRenta'],false], 0.5,
      ['boolean',['feature-state','hover'],false], 0.15,
      0
    ]);
    map.setPaintProperty('secciones-line','line-opacity',0.2);

    showRentaLegend(true, p20, p50, p80);
  } else {
    map.setPaintProperty('secciones-fill','fill-color','#d4c4a0');
    map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.15,0]);
    map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0]);
    showRentaLegend(false);
  }
}

function showRentaLegend(show, p20, p50, p80) {
  var el = document.getElementById('renta-legend');
  if (!show) { if(el) el.style.display='none'; return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'renta-legend';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(10,10,10,0.94);border:1px solid #222;border-radius:8px;padding:8px 14px;font-size:9px;color:#aaa;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px)';
    document.body.appendChild(el);
  }
  el.style.display = 'flex';
  el.innerHTML = '<span style="color:#c45a4a">&#9632;</span> &lt;'+Math.round(p20/1000)+'k&euro;' +
    ' <span style="background:linear-gradient(90deg,#c45a4a,#d4c44a,#4aaa5a);width:60px;height:8px;border-radius:2px;display:inline-block"></span> ' +
    '<span style="color:#4aaa5a">&#9632;</span> &gt;'+Math.round(p80/1000)+'k&euro;' +
    ' <span style="color:#555;margin-left:4px">Renta media/persona (INE)</span>';
}

// ===== LEVELS =====
function showProvincia() {
  level = 'provincia'; activeMun = null; activeSec = null;
  map.setFilter('secciones-fill', null);
  map.setFilter('secciones-line', null);

  if (rentaVisible) {
    // Keep renta colors active
  } else {
    map.setPaintProperty('secciones-fill','fill-color','#d4c4a0');
    map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0]);
    map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.15,0]);
  }
  if(map.getLayer('mun-labels')) map.setLayoutProperty('mun-labels','visibility','visible');
  removeBuildings();
  removeAllBuildings();
  removeMunHighlight();

  map.flyTo({center:PROVINCE_CENTER, zoom:PROVINCE_ZOOM, pitch:0, bearing:0, duration:1000, essential:true});
  updateUI();
}

function enterMunicipio(mun) {
  level = 'municipio'; activeMun = mun; activeSec = null;
  removeBuildings();
  removeAllBuildings();

  map.setFilter('secciones-fill', ['==',['get','mun'], mun]);
  map.setFilter('secciones-line', ['==',['get','mun'], mun]);
  map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0.25]);
  map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.25,0.05]);
  if(map.getLayer('mun-labels')) map.setLayoutProperty('mun-labels','visibility','none');

  var munSecs = SECCIONES.features.filter(function(f){return f.properties.mun === mun;});
  showMunHighlight(munSecs);

  var munInfo = MUNICIPIOS.features.find(function(f){return f.properties.mun === mun;});
  if(munInfo) {
    var c = munInfo.properties.center;
    var zoom = munSecs.length > 50 ? 13 : munSecs.length > 20 ? 12.5 : 12;
    map.flyTo({center:c, zoom:zoom, pitch:0, duration:1200, essential:true});
  }
  updateUI();
}

function enterSeccion(cusec, mun) {
  level = 'seccion'; activeSec = cusec; activeMun = mun;

  map.setFilter('secciones-fill', ['==',['get','mun'], mun]);
  map.setFilter('secciones-line', ['==',['get','mun'], mun]);
  map.setPaintProperty('secciones-fill','fill-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.2,0.03]);
  map.setPaintProperty('secciones-line','line-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.5,0.12]);

  // If all-buildings mode is on, don't load single section
  if (!allBuildingsOn) {
    showLoading('Cargando edificios...');
    loadMunBuildings(mun).then(function(munData) {
      hideLoading();
      var raw = munData[cusec];
      if (!raw) { console.log('No building data for cusec ' + cusec); return; }
      var features = raw.map(function(b, i) {
        return {
          type:'Feature', id:i,
          geometry:{type:'Polygon',coordinates:[b[0]]},
          properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_id:i,_cusec:cusec}
        };
      });
      renderBuildings(features);
    }).catch(function(err) {
      hideLoading();
      console.log('No building data for mun ' + mun + ': ' + err.message);
    });
  }

  // Fly to section
  var secFeat = SECCIONES.features.find(function(f){return f.properties.cusec === cusec;});
  if(secFeat) {
    var b = getBounds(secFeat.geometry);
    var c = [(b[0][0]+b[1][0])/2, (b[0][1]+b[1][1])/2];
    map.flyTo({center:c, zoom:17, pitch:55, bearing:map.getBearing(), duration:1200, essential:true});
  }

  // Highlight section
  if(secFeat) {
    if(!map.getSource('sec-hl')) map.addSource('sec-hl',{type:'geojson',data:{type:'FeatureCollection',features:[secFeat]}});
    else map.getSource('sec-hl').setData({type:'FeatureCollection',features:[secFeat]});
    if(!map.getLayer('sec-hl-line')) map.addLayer({id:'sec-hl-line',type:'line',source:'sec-hl',paint:{'line-color':'#e0d0b0','line-width':1,'line-opacity':0.5}});
  }

  updateUI();
}

// ===== BUILDINGS =====
function renderBuildings(features) {
  removeBuildings();
  var data = {type:'FeatureCollection',features:features};

  // Shadow layer
  var shadows = features.map(function(f){
    var h = f.properties._h || 8;
    var coords = f.geometry.coordinates[0].map(function(c){
      return [c[0] + h*0.000004, c[1] - h*0.000003];
    });
    return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{_h:h}};
  });
  if(!map.getSource('bld-shadow')) map.addSource('bld-shadow',{type:'geojson',data:{type:'FeatureCollection',features:shadows}});
  else map.getSource('bld-shadow').setData({type:'FeatureCollection',features:shadows});
  map.addLayer({
    id:'bld-shadow',type:'fill',source:'bld-shadow',
    paint:{'fill-color':'#000','fill-opacity':['interpolate',['linear'],['get','_h'],3,0.10,8,0.18,15,0.28,25,0.35]}
  });

  if(!map.getSource('buildings')) map.addSource('buildings',{type:'geojson',data:data});
  else map.getSource('buildings').setData(data);
  map.addLayer({
    id:'buildings-3d',type:'fill-extrusion',source:'buildings',
    paint:{
      'fill-extrusion-color':['case',['boolean',['feature-state','hover'],false],'#f0e0c0','#c8b898'],
      'fill-extrusion-height':['get','_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.92,
      'fill-extrusion-vertical-gradient':true
    }
  });

  // Hover
  var bHov = null;
  map.on('mousemove','buildings-3d',function(e){
    if(!e.features.length) return;
    map.getCanvas().style.cursor='pointer';
    if(bHov!==null) map.setFeatureState({source:'buildings',id:bHov},{hover:false});
    bHov = e.features[0].id;
    map.setFeatureState({source:'buildings',id:bHov},{hover:true});
  });
  map.on('mouseleave','buildings-3d',function(){
    map.getCanvas().style.cursor='';
    if(bHov!==null){map.setFeatureState({source:'buildings',id:bHov},{hover:false});bHov=null;}
  });
  map.on('click','buildings-3d',function(e){
    if(!e.features||!e.features.length) return;
    var p = e.features[0].properties;
    var h = parseFloat(p._h)||8;
    var floors = Math.round(h/3);
    var html = '<div style="padding:10px;font-size:11px">';
    html += '<div style="font-size:13px;font-weight:700;color:#d4c4a0;margin-bottom:4px">Edificio</div>';
    html += '<div style="color:#666;margin-bottom:2px">Altura: <span style="color:#ccc">'+Math.round(h)+'m</span> &middot; Plantas: <span style="color:#ccc">'+floors+'</span></div>';
    html += '<div style="color:#666">Secci&oacute;n: <span style="color:#ccc">'+(p._cusec||'—')+'</span></div>';
    html += '</div>';
    new maplibregl.Popup({maxWidth:'250px'}).setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
}

function removeBuildings() {
  ['bld-shadow','buildings-3d','sec-hl-line'].forEach(function(id){
    if(map.getLayer(id)) map.removeLayer(id);
  });
}

// ===== ALL BUILDINGS TOGGLE =====
function toggleAllBuildings() {
  allBuildingsOn = !allBuildingsOn;
  var btn = document.getElementById('all-buildings-toggle');
  btn.classList.toggle('active', allBuildingsOn);

  if (allBuildingsOn) {
    loadAllBuildingsForMun(activeMun);
  } else {
    removeAllBuildings();
    // If we're at seccion level, reload single section buildings
    if (level === 'seccion' && activeSec) {
      var secFile = 'buildings/' + activeSec + '.json';
      fetch(secFile).then(function(r){
        if(!r.ok) throw new Error('No buildings');
        return r.json();
      }).then(function(raw){
        var features = raw.map(function(b,i){
          return {
            type:'Feature',id:i,
            geometry:{type:'Polygon',coordinates:[b[0]]},
            properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_id:i,_cusec:activeSec}
          };
        });
        renderBuildings(features);
      }).catch(function(){});
    }
  }
}

function loadAllBuildingsForMun(mun) {
  if (!mun || !SECCIONES) return;
  removeBuildings();
  removeAllBuildings();

  showLoading('Cargando todos los edificios del municipio...');

  loadMunBuildings(mun).then(function(munData) {
    hideLoading();
    var allFeatures = [];
    var featureIdCounter = 0;
    Object.keys(munData).forEach(function(cusec) {
      var raw = munData[cusec];
      raw.forEach(function(b) {
        allFeatures.push({
          type:'Feature', id:featureIdCounter++,
          geometry:{type:'Polygon',coordinates:[b[0]]},
          properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_cusec:cusec}
        });
      });
    });
    if (allFeatures.length > 0 && allBuildingsOn) {
      renderAllBuildings(allFeatures);
    }
  }).catch(function(err) {
    hideLoading();
    console.log('No building data for mun ' + mun + ': ' + err.message);
  });
}

function renderAllBuildings(features) {
  var data = {type:'FeatureCollection',features:features};

  // Shadow layer
  var shadows = features.map(function(f){
    var h = f.properties._h || 8;
    var coords = f.geometry.coordinates[0].map(function(c){
      return [c[0] + h*0.000004, c[1] - h*0.000003];
    });
    return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{_h:h}};
  });

  if(!map.getSource('all-bld-shadow')) map.addSource('all-bld-shadow',{type:'geojson',data:{type:'FeatureCollection',features:shadows}});
  else map.getSource('all-bld-shadow').setData({type:'FeatureCollection',features:shadows});
  map.addLayer({
    id:'all-bld-shadow',type:'fill',source:'all-bld-shadow',
    paint:{'fill-color':'#000','fill-opacity':['interpolate',['linear'],['get','_h'],3,0.08,8,0.14,15,0.22,25,0.30]}
  });

  if(!map.getSource('all-buildings')) map.addSource('all-buildings',{type:'geojson',data:data});
  else map.getSource('all-buildings').setData(data);
  map.addLayer({
    id:'all-buildings-3d',type:'fill-extrusion',source:'all-buildings',
    paint:{
      'fill-extrusion-color':'#c8b898',
      'fill-extrusion-height':['get','_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.88,
      'fill-extrusion-vertical-gradient':true
    }
  });

  allBuildingsLoaded = features;
  console.log('Rendered ' + features.length + ' buildings for municipality');
}

function removeAllBuildings() {
  ['all-bld-shadow','all-buildings-3d'].forEach(function(id){
    if(map.getLayer(id)) map.removeLayer(id);
  });
  allBuildingsLoaded = [];
}

function showMunHighlight(secs) {
  removeMunHighlight();
  var data = {type:'FeatureCollection',features:secs};
  if(!map.getSource('mun-hl')) map.addSource('mun-hl',{type:'geojson',data:data});
  else map.getSource('mun-hl').setData(data);
  map.addLayer({
    id:'mun-hl',type:'line',source:'mun-hl',
    paint:{'line-color':'#d4c4a0','line-width':1.5,'line-opacity':0.3,'line-dasharray':[4,2]}
  });
}
function removeMunHighlight(){
  if(map.getLayer('mun-hl')) map.removeLayer('mun-hl');
}

// ===== UI =====
function updateUI() {
  updateBreadcrumb();
  updateStats();
  updateMunList();
  updateAllBuildingsToggleVisibility();
}

function updateBreadcrumb() {
  var bc = document.getElementById('bc');
  var parts = [];
  if(level === 'provincia') {
    parts.push('<span class="active">Las Palmas</span>');
  } else {
    parts.push('<span onclick="showProvincia()">Las Palmas</span>');
    parts.push('<span class="sep">&#8250;</span>');
  }
  if(level === 'municipio') {
    var nm = getMunName(activeMun);
    parts.push('<span class="active">'+nm+'</span>');
  } else if(level === 'seccion') {
    var nm = getMunName(activeMun);
    parts.push('<span onclick="enterMunicipio(\''+activeMun+'\')">'+nm+'</span>');
    parts.push('<span class="sep">&#8250;</span>');
    parts.push('<span class="active">S'+activeSec.slice(-3)+'</span>');
  }
  bc.innerHTML = parts.join('');
}

function updateStats() {
  var el = document.getElementById('stats');
  if(level === 'provincia') {
    el.innerHTML = '<b>3</b> islas &middot; <b>34</b> municipios &middot; <b>709</b> secciones censales<br>Prov. 35 &middot; <b>3 islas</b>';
  } else if(level === 'municipio') {
    var secs = SECCIONES.features.filter(function(f){return f.properties.mun===activeMun;});
    var island = ISLAND_FOR_MUN[activeMun] || '?';
    el.innerHTML = '<b>'+secs.length+'</b> secciones &middot; '+island+'<br>Click en secci&oacute;n para ver edificios';
  } else if(level === 'seccion') {
    el.innerHTML = 'Secci&oacute;n <b>'+activeSec+'</b><br>Municipio: <b>'+getMunName(activeMun)+'</b>';
  }
}

function updateMunList() {
  var el = document.getElementById('mun-list');
  if(level === 'seccion') { el.innerHTML = ''; return; }

  var muns = MUNICIPIOS.features.slice().sort(function(a,b){
    return a.properties.nmun.localeCompare(b.properties.nmun);
  });

  var html = '';
  ['Gran Canaria','Fuerteventura','Lanzarote'].forEach(function(island) {
    html += '<div style="font-size:8px;color:#444;margin:6px 0 2px;text-transform:uppercase;letter-spacing:1px">'+island+'</div>';
    muns.forEach(function(f) {
      var p = f.properties;
      if(ISLAND_FOR_MUN[p.mun] !== island) return;
      var isActive = p.mun === activeMun;
      html += '<div class="mun-item'+(isActive?' active':'')+'" onclick="enterMunicipio(\''+p.mun+'\')">';
      html += '<span class="name">'+p.nmun+'</span>';
      html += '<span class="count">'+p.sections+'</span>';
      html += '</div>';
    });
  });
  el.innerHTML = html;
}

function updateAllBuildingsToggleVisibility() {
  var btn = document.getElementById('all-buildings-toggle');
  if (level === 'municipio' || level === 'seccion') {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
    // Reset if going back to provincia
    if (allBuildingsOn) {
      allBuildingsOn = false;
      btn.classList.remove('active');
      removeAllBuildings();
    }
  }
}

function getMunName(mun) {
  var f = MUNICIPIOS.features.find(function(f){return f.properties.mun === mun;});
  return f ? f.properties.nmun : mun;
}

// ===== NAV =====
function goUp() {
  if(level === 'seccion' && activeMun) enterMunicipio(activeMun);
  else if(level === 'municipio') showProvincia();
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') goUp();
});

// ===== HELPERS =====
function getBounds(geom){
  var minLng=180,maxLng=-180,minLat=90,maxLat=-90;
  function scan(c){
    if(typeof c[0]==='number'){
      if(c[0]<minLng)minLng=c[0];if(c[0]>maxLng)maxLng=c[0];
      if(c[1]<minLat)minLat=c[1];if(c[1]>maxLat)maxLat=c[1];
    }else{for(var i=0;i<c.length;i++)scan(c[i]);}
  }
  scan(geom.coordinates);
  return[[minLng,minLat],[maxLng,maxLat]];
}
function showLoading(msg){var l=document.getElementById('loading');l.textContent=msg;l.classList.add('on');}
function hideLoading(){document.getElementById('loading').classList.remove('on');}
</script>
