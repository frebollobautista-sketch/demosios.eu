<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOINOS POLIS — Provincia de Las Palmas</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:system-ui,sans-serif}
#map{width:100%;height:100vh}

/* ===== ISLAND NAV — top center, outline only ===== */
.island-nav{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;
  pointer-events:none;
}
.island-nav svg{display:block;pointer-events:all}
.island-nav path{
  fill:none;stroke:rgba(180,160,110,0.18);stroke-width:0.6;
  cursor:pointer;transition:fill .2s,stroke .2s,stroke-width .2s;
}
.island-nav path.active{stroke:rgba(212,196,160,0.35);stroke-width:0.7}
.island-nav path:hover{fill:rgba(212,196,160,0.12);stroke:rgba(212,196,160,0.55);stroke-width:0.9}
.island-nav path.current{fill:rgba(212,196,160,0.1);stroke:rgba(212,196,160,0.7);stroke-width:1.1}
.island-nav .island-tooltip{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;color:rgba(212,196,160,0.7);white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .15s;
  font-family:system-ui,sans-serif;letter-spacing:0.5px;
}
.island-nav.show-tip .island-tooltip{opacity:1}

/* ===== NOTEBOOK PANEL ===== */
.notebook{
  position:fixed;top:10px;left:10px;z-index:10;
  transition:all .35s cubic-bezier(.4,0,.2,1);
}

/* Cover (closed state) */
.notebook-cover{
  width:44px;height:140px;
  background:linear-gradient(135deg,#1a1610 0%,#15120e 50%,#1a1610 100%);
  border:1px solid #2a2520;border-radius:3px 8px 8px 3px;
  cursor:pointer;position:relative;overflow:hidden;
  box-shadow:2px 2px 12px rgba(0,0,0,0.5);
  transition:all .25s;
}
.notebook-cover:hover{border-color:#3a3530;box-shadow:2px 2px 16px rgba(0,0,0,0.6)}
/* Spine line */
.notebook-cover::before{
  content:'';position:absolute;left:4px;top:8px;bottom:8px;width:1px;
  background:linear-gradient(180deg,transparent,rgba(212,196,160,0.12),rgba(212,196,160,0.15),rgba(212,196,160,0.12),transparent);
}
/* Embossed title */
.notebook-cover .cover-title{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);
  white-space:nowrap;font-size:8px;letter-spacing:2px;
  color:rgba(212,196,160,0.25);font-weight:700;
  text-transform:uppercase;
}

/* Open state */
.notebook.open .notebook-cover{display:none}
.notebook-page{
  display:none;width:300px;
  background:linear-gradient(135deg,#141210 0%,#121010 40%,#151311 100%);
  border:1px solid #2a2520;border-radius:3px 10px 10px 3px;
  position:relative;overflow:hidden;
  box-shadow:3px 3px 20px rgba(0,0,0,0.5);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.notebook.open .notebook-page{display:block}
/* Spine */
.notebook-page::before{
  content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(212,196,160,0.08),rgba(212,196,160,0.1),rgba(212,196,160,0.08),transparent);
}
.notebook-page-inner{
  padding:14px 14px 14px 18px;
  background:linear-gradient(180deg,rgba(20,18,14,0.3) 0%,transparent 30%);
}

/* Close button */
.notebook-close{
  position:absolute;top:6px;right:8px;z-index:2;
  background:none;border:none;color:rgba(212,196,160,0.3);font-size:14px;
  cursor:pointer;transition:color .15s;line-height:1;
}
.notebook-close:hover{color:rgba(212,196,160,0.6)}

.notebook h1{font-size:14px;color:#d4c4a0;letter-spacing:1px;margin-bottom:2px;font-weight:700}
.notebook .sub{color:#555;font-size:9px;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}

.breadcrumb{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.breadcrumb span{
  background:#1a1a1a;padding:3px 8px;border-radius:4px;font-size:10px;
  cursor:pointer;border:1px solid #222;transition:all .15s;color:#888;
}
.breadcrumb span:hover{background:#222;border-color:#444;color:#ddd}
.breadcrumb span.active{background:#d4c4a0;color:#111;font-weight:600;border-color:#d4c4a0;cursor:default}
.breadcrumb span.sep{background:none;border:none;color:#444;cursor:default;padding:3px 2px}

.stats{font-size:10px;color:#777;line-height:1.7;margin-top:6px}
.stats b{color:#d4c4a0}

.mun-list{margin-top:6px;max-height:300px;overflow-y:auto}
.mun-item{
  padding:5px 8px;border-radius:5px;font-size:10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;margin-bottom:1px;
  background:transparent;border:1px solid transparent;transition:all .12s;
}
.mun-item:hover{background:#1a1a1a;border-color:#2a2a2a}
.mun-item.active{background:#1a1a1a;border-color:#d4c4a0}
.mun-item .name{color:#aaa;flex:1}
.mun-item .count{color:#444;font-size:9px}

/* ===== ALL BUILDINGS TOGGLE ===== */
.all-buildings-toggle{
  margin-top:8px;padding:6px 10px;border-radius:6px;
  background:#1a1a1a;border:1px solid #2a2520;
  cursor:pointer;display:none;align-items:center;gap:8px;
  font-size:10px;color:#888;transition:all .15s;
}
.all-buildings-toggle:hover{background:#222;border-color:#444;color:#ccc}
.all-buildings-toggle.active{border-color:#d4c4a0;color:#d4c4a0}
.all-buildings-toggle .toggle-switch{
  width:28px;height:14px;border-radius:7px;
  background:#333;position:relative;transition:background .2s;flex-shrink:0;
}
.all-buildings-toggle.active .toggle-switch{background:#5a5040}
.all-buildings-toggle .toggle-switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:10px;height:10px;border-radius:50%;
  background:#888;transition:all .2s;
}
.all-buildings-toggle.active .toggle-switch::after{left:16px;background:#d4c4a0}

/* ===== LAYER PANEL ("Capas") ===== */
.layer-btn{
  position:fixed;top:10px;right:10px;z-index:11;
  background:linear-gradient(135deg,#1a1610 0%,#15120e 100%);
  border:1px solid #2a2520;border-radius:8px;
  padding:9px 12px;color:#d4c4a0;font-size:12px;letter-spacing:1px;
  font-family:system-ui,sans-serif;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  box-shadow:2px 2px 12px rgba(0,0,0,0.45);
  transition:border-color .2s, box-shadow .2s;
  text-transform:uppercase;
}
.layer-btn:hover{border-color:#3a3530;box-shadow:2px 2px 16px rgba(0,0,0,0.55)}
.layer-btn.has-active{border-color:#d4c4a0;color:#fff5d8}
.layer-btn .layer-btn-count{
  background:#d4c4a0;color:#15120e;font-weight:700;
  border-radius:10px;padding:1px 6px;font-size:10px;letter-spacing:0;
}
.layer-btn .layer-btn-icon{font-size:14px;line-height:1}

.layer-panel{
  position:fixed;top:0;right:0;height:100vh;width:320px;z-index:13;
  background:linear-gradient(180deg,#161310 0%,#100e0c 100%);
  border-left:1px solid #2a2520;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,0.5);
}
.layer-panel.open{transform:translateX(0)}
.layer-panel-header{
  padding:14px 16px 10px;border-bottom:1px solid #2a2520;
  display:flex;align-items:center;justify-content:space-between;
}
.layer-panel-header h2{
  font-size:11px;letter-spacing:2px;color:#d4c4a0;
  text-transform:uppercase;font-weight:500;
}
.layer-panel-header .close-btn{
  background:none;border:none;color:#8a7a5a;cursor:pointer;
  font-size:20px;line-height:1;padding:0 4px;
}
.layer-panel-header .close-btn:hover{color:#d4c4a0}
.layer-panel-body{flex:1;overflow-y:auto;padding:8px 0}
.layer-panel-body::-webkit-scrollbar{width:4px}
.layer-panel-body::-webkit-scrollbar-thumb{background:#2a2520;border-radius:2px}

.cat-group{border-bottom:1px solid #1f1c18}
.cat-header{
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.cat-header:hover{background:#1c1916}
.cat-header .cat-title{
  font-size:11px;letter-spacing:1.5px;color:#a89c80;
  text-transform:uppercase;font-weight:500;
}
.cat-header .cat-arrow{font-size:9px;color:#5a5040;transition:transform .2s}
.cat-group.open .cat-header .cat-arrow{transform:rotate(90deg)}
.cat-body{display:none;padding:0 16px 8px}
.cat-group.open .cat-body{display:block}

.layer-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:8px 6px;border-radius:5px;cursor:pointer;
  transition:background .15s;
}
.layer-row:hover{background:#1c1916}
.layer-row.disabled{cursor:not-allowed;opacity:0.5}
.layer-row.disabled:hover{background:transparent}
.layer-checkbox{
  width:16px;height:16px;border-radius:3px;border:1px solid #3a3530;
  background:#0c0a08;flex-shrink:0;margin-top:1px;position:relative;
  transition:all .15s;
}
.layer-row.active .layer-checkbox{
  background:#d4c4a0;border-color:#d4c4a0;
}
.layer-row.active .layer-checkbox::after{
  content:'✓';position:absolute;left:2px;top:-2px;
  color:#15120e;font-size:13px;font-weight:700;
}
.layer-info{flex:1;min-width:0}
.layer-info .layer-name{
  font-size:12px;color:#d4c4a0;font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.layer-info .layer-dot{
  width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;
}
.layer-info .layer-source{
  font-size:9.5px;color:#5a5040;margin-top:2px;letter-spacing:0.3px;
}
.layer-soon{
  background:#2a2520;color:#8a7a5a;
  font-size:8.5px;padding:1px 5px;border-radius:3px;letter-spacing:1px;
  margin-left:auto;flex-shrink:0;
}
.layer-panel-footer{
  padding:10px 16px;border-top:1px solid #2a2520;
  font-size:9px;color:#5a5040;letter-spacing:0.3px;line-height:1.5;
}
.layer-panel-footer a{color:#8a7a5a;text-decoration:underline}

/* Mobile: bottom-sheet */
@media (max-width:720px){
  .layer-panel{
    top:auto;bottom:0;width:100%;height:70vh;
    border-left:none;border-top:1px solid #2a2520;
    border-radius:14px 14px 0 0;
    transform:translateY(100%);
  }
  .layer-panel.open{transform:translateY(0)}
}

.loading{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(10,10,10,0.94);color:#d4c4a0;padding:6px 14px;border-radius:8px;
  font-size:10px;font-weight:600;display:none;border:1px solid rgba(212,196,160,0.15);
}
.loading.on{display:block}

.maplibregl-popup-content{
  background:rgba(12,12,12,0.97)!important;border:1px solid rgba(212,196,160,0.15)!important;
  border-radius:10px!important;color:#e0e0e0!important;padding:0!important;
  backdrop-filter:blur(10px)!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;
}
.maplibregl-popup-tip{border-top-color:rgba(12,12,12,0.97)!important}
.maplibregl-popup-close-button{color:#888!important;font-size:16px!important}
</style>
</head>
<body>
<div id="map"></div>

<!-- Botón flotante "Capas" -->
<button class="layer-btn" id="layer-btn" onclick="toggleLayerPanel()">
  <span class="layer-btn-icon">🗂️</span>
  <span>Capas</span>
  <span class="layer-btn-count" id="layer-btn-count" style="display:none">0</span>
</button>

<!-- Panel "Capas" -->
<aside class="layer-panel" id="layer-panel" aria-hidden="true">
  <div class="layer-panel-header">
    <h2>Capas activas</h2>
    <button class="close-btn" onclick="toggleLayerPanel()" aria-label="Cerrar panel">×</button>
  </div>
  <div class="layer-panel-body" id="layer-panel-body">
    <!-- Categorías inyectadas por JS desde LAYER_CATALOG -->
  </div>
  <div class="layer-panel-footer">
    Las capas marcadas como <em>próximamente</em> se publicarán en las siguientes
    semanas. Los datos se sirven desde sus fuentes originales y se citan en cada
    capa. <a href="https://demosios.eu/canarias-en-datos" target="_top">Ver el plan</a>.
  </div>
</aside>

<!-- Island navigator — top center -->
<div class="island-nav" id="island-nav">
  <div class="island-tooltip" id="island-tooltip"></div>
  <svg id="island-svg" viewBox="0 0 500 195" width="420" height="80" xmlns="http://www.w3.org/2000/svg">
  </svg>
</div>

<!-- Notebook panel -->
<div class="notebook" id="notebook">
  <div class="notebook-cover" id="notebook-cover" onclick="toggleNotebook()">
    <span class="cover-title">K0IN0S POLIS</span>
  </div>
  <div class="notebook-page">
    <button class="notebook-close" onclick="toggleNotebook()">&times;</button>
    <div class="notebook-page-inner">
      <h1>K0IN0S POLIS</h1>
      <div class="sub">Provincia de Las Palmas</div>
      <div class="breadcrumb" id="bc"></div>
      <div class="stats" id="stats"></div>
      <div class="all-buildings-toggle" id="all-buildings-toggle" onclick="toggleAllBuildings()">
        <div class="toggle-switch"></div>
        <span>Todos los edificios</span>
      </div>
      <div class="mun-list" id="mun-list"></div>
    </div>
  </div>
</div>

<div class="loading" id="loading">Cargando...</div>

// Build island nav SVG
(function(){
  var svg = document.getElementById('island-svg');
  var tooltip = document.getElementById('island-tooltip');
  var navContainer = document.getElementById('island-nav');

  ISLAND_NAV.forEach(function(isl){
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', isl.d);
    path.setAttribute('data-island', isl.name);
    if(isl.active) path.classList.add('active');

    path.addEventListener('mouseenter', function(){
      tooltip.textContent = isl.name;
      navContainer.classList.add('show-tip');
    });
    path.addEventListener('mouseleave', function(){
      navContainer.classList.remove('show-tip');
    });

    path.addEventListener('click', function(){
      // Fly to island — no showProvincia, just smooth fly
      map.flyTo({center:isl.center, zoom:isl.zoom, pitch:0, bearing:0, duration:1200, essential:true});
      // Update current highlight
      svg.querySelectorAll('path').forEach(function(p){p.classList.remove('current');});
      path.classList.add('current');
    });
    svg.appendChild(path);
  });
})();

// Renta data store
var RENTA_DATA = null;
var rentaVisible = false;

// ===== OSM DATA LOADING =====
function loadOSMLayers() {
  var fileLayers = DATA_LAYERS.filter(function(l){return l.file;});
  fileLayers.forEach(function(layer) {
    fetchWithFallback(layer.file, layer.fallback).then(function(result) {
      layer.data = result.data;
      layer.loaded = true;
      layer.coverage = result.source === layer.file ? 'Prov. 35' : 'LPGC';

      if (layer.id === 'renta') {
        RENTA_DATA = result.data;
        layer.coverage = Object.keys(result.data).length + ' secciones';
        console.log('Renta loaded: ' + Object.keys(result.data).length + ' sections');
      } else if (layer.id === 'vv') {
        setupVVLayer(result.data);
        layer.coverage = (result.data.features ? result.data.features.length : '?') + ' VV';
        console.log('VV loaded: ' + (result.data.features ? result.data.features.length : '?') + ' establishments');
      } else {
        setupOSMLayer(layer, result.data);
        console.log('Loaded ' + layer.id + ' (' + layer.coverage + '): ' + (result.data.features ? result.data.features.length : '?') + ' features');
      }
    }).catch(function(e) {
      console.warn('Could not load ' + layer.id + ':', e.message);
    });
  });
}

function fetchWithFallback(primary, fallback) {
  return fetch(primary).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.json().then(function(data) { return {data:data, source:primary}; });
  }).catch(function() {
    if (!fallback) throw new Error('No fallback');
    return fetch(fallback).then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json().then(function(data) { return {data:data, source:fallback}; });
    });
  });
}

function setupOSMLayer(layer, data) {
  var id = layer.id;
  if (map.getSource(id)) return;

  if (id === 'osm-roads') {
    map.addSource(id, {type:'geojson', data:data});
    map.addLayer({
      id:id, type:'line', source:id,
      paint:{
        'line-color':['match',['get','highway'],'primary','#5a5040','secondary','#4a4030','#3a3528'],
        'line-width':['interpolate',['linear'],['zoom'],
          12,['match',['get','highway'],'primary',1.5,'secondary',1,0],
          14,['match',['get','highway'],'primary',3,'secondary',2.2,'tertiary',1.5,'residential',0.8,0.5],
          17,['match',['get','highway'],'primary',5,'secondary',3.5,'tertiary',2.5,'residential',1.2,0.6]
        ],
        'line-opacity':['interpolate',['linear'],['zoom'],12,0.3,14,0.5,16,0.6]
      },
      minzoom:12
    }, 'labels');
  } else if (id === 'osm-parks') {
    var polys = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Polygon';})};
    map.addSource(id, {type:'geojson', data:polys});
    map.addLayer({
      id:id, type:'fill', source:id,
      paint:{'fill-color':'#2a5a18','fill-opacity':['interpolate',['linear'],['zoom'],12,0.25,16,0.5]},
      minzoom:12
    }, 'labels');
  } else if (id === 'osm-coast') {
    map.addSource(id, {type:'geojson', data:data});
    map.addLayer({
      id:id, type:'line', source:id,
      paint:{'line-color':'#2a6a9a','line-width':['interpolate',['linear'],['zoom'],11,1.5,16,3],'line-opacity':0.6},
      minzoom:11
    }, 'labels');
  } else if (id === 'osm-water') {
    var polys = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Polygon';})};
    map.addSource(id, {type:'geojson', data:polys});
    map.addLayer({
      id:id, type:'fill', source:id,
      paint:{'fill-color':'#1a4a6a','fill-opacity':['interpolate',['linear'],['zoom'],13,0.3,16,0.5]},
      minzoom:13
    }, 'labels');
  } else if (id === 'osm-pois') {
    var pts = {type:'FeatureCollection',features:data.features.filter(function(f){return f.geometry.type==='Point'&&f.properties.name;})};
    map.addSource(id, {type:'geojson', data:pts});
    map.addLayer({
      id:id, type:'circle', source:id,
      paint:{'circle-radius':['interpolate',['linear'],['zoom'],14,1.5,16,3],'circle-color':'#d4c4a0','circle-opacity':0.6,'circle-stroke-width':0.5,'circle-stroke-color':'#0a0a0a'},
      minzoom:14
    });
    map.addLayer({
      id:id+'-label', type:'symbol', source:id,
      layout:{'text-field':['get','name'],'text-size':9,'text-offset':[0.8,0],'text-anchor':'left','text-allow-overlap':false},
      paint:{'text-color':'#b0a080','text-halo-color':'rgba(0,0,0,0.7)','text-halo-width':1},
      minzoom:15
    });
  }
}

  map.addLayer({
    id:'secciones-line', type:'line', source:'secciones',
    paint:{
      'line-color':'#d4c4a0',
      'line-width':['case',['boolean',['feature-state','hover'],false],1.5,0.3],
      'line-opacity':['case',['boolean',['feature-state','hover'],false],0.6,0]
    }
  });

  var hovId = null;
  var rentaPopup = null;
  map.on('mousemove','secciones-fill',function(e){
    if(!e.features.length) return;
    map.getCanvas().style.cursor = 'pointer';
    if(hovId !== null) map.setFeatureState({source:'secciones',id:hovId},{hover:false});
    hovId = e.features[0].id;
    map.setFeatureState({source:'secciones',id:hovId},{hover:true});
    // Renta tooltip
    if(rentaVisible && RENTA_DATA) {
      var cusec = e.features[0].properties.cusec;
      var r = RENTA_DATA[cusec];
      if(r) {
        var html = '<div style="padding:6px 10px;font-size:11px"><b style="color:#d4c4a0">'+e.features[0].properties.nmun+'</b> S'+cusec.slice(-3)+'<br><span style="color:#ccc;font-size:13px;font-weight:700">'+r.renta.toLocaleString('es')+'€</span> <span style="color:#666">renta media/persona</span></div>';
        if(!rentaPopup) rentaPopup = new maplibregl.Popup({closeButton:false,closeOnClick:false,maxWidth:'200px',offset:10});
        rentaPopup.setLngLat(e.lngLat).setHTML(html).addTo(map);
      } else if(rentaPopup) { rentaPopup.remove(); rentaPopup=null; }
    }
  });
  map.on('mouseleave','secciones-fill',function(){
    map.getCanvas().style.cursor = '';
    if(hovId !== null){map.setFeatureState({source:'secciones',id:hovId},{hover:false});hovId=null;}
    if(rentaPopup){rentaPopup.remove();rentaPopup=null;}
  });

  map.on('click','secciones-fill',function(e){
    if(!e.features.length) return;
    var p = e.features[0].properties;
    if(level === 'provincia') {
      enterMunicipio(p.mun);
    } else if(level === 'municipio') {
      enterSeccion(p.cusec, p.mun);
    } else if(level === 'seccion' && p.cusec !== activeSec) {
      enterSeccion(p.cusec, p.mun);
    }
  });
}

// ===== RENTA LAYER =====
function toggleRenta() {
  if (!RENTA_DATA) {
    console.warn('Datos de renta aún no cargados');
    return;
  }
  rentaVisible = !rentaVisible;
  if(typeof syncActiveLayer === 'function') syncActiveLayer('renta', rentaVisible);

  if (rentaVisible) {
    var rentas = Object.values(RENTA_DATA).map(function(r){return r.renta;}).sort(function(a,b){return a-b;});
    var p20 = rentas[Math.floor(rentas.length*0.2)] || 7000;
    var p50 = rentas[Math.floor(rentas.length*0.5)] || 10000;
    var p80 = rentas[Math.floor(rentas.length*0.8)] || 14000;
    window._rentaBreaks = {p20:p20, p50:p50, p80:p80};

    SECCIONES.features.forEach(function(f) {
      var cusec = f.properties.cusec;
      var r = RENTA_DATA[cusec];
      if (r) {
        map.setFeatureState({source:'secciones', id:f.id}, {renta: r.renta, hasRenta: true});
      }
    });

    map.setPaintProperty('secciones-fill','fill-color',[
      'case',
      ['boolean',['feature-state','hasRenta'],false],
      ['interpolate',['linear'],['feature-state','renta'],
        p20, '#c45a4a',
        p50, '#d4c44a',
        p80, '#4aaa5a'
      ],
      'rgba(0,0,0,0)'
    ]);
    map.setPaintProperty('secciones-fill','fill-opacity',[
      'case',
      ['boolean',['feature-state','hasRenta'],false], 0.5,
      ['boolean',['feature-state','hover'],false], 0.15,
      0
    ]);
    map.setPaintProperty('secciones-line','line-opacity',0.2);

    showRentaLegend(true, p20, p50, p80);
  } else {
    map.setPaintProperty('secciones-fill','fill-color','#d4c4a0');
    map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.15,0]);
    map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0]);
    showRentaLegend(false);
  }
}

function showRentaLegend(show, p20, p50, p80) {
  var el = document.getElementById('renta-legend');
  if (!show) { if(el) el.style.display='none'; return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'renta-legend';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(10,10,10,0.94);border:1px solid #222;border-radius:8px;padding:8px 14px;font-size:9px;color:#aaa;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px)';
    document.body.appendChild(el);
  }
  el.style.display = 'flex';
  el.innerHTML = '<span style="color:#c45a4a">&#9632;</span> &lt;'+Math.round(p20/1000)+'k&euro;' +
    ' <span style="background:linear-gradient(90deg,#c45a4a,#d4c44a,#4aaa5a);width:60px;height:8px;border-radius:2px;display:inline-block"></span> ' +
    '<span style="color:#4aaa5a">&#9632;</span> &gt;'+Math.round(p80/1000)+'k&euro;' +
    ' <span style="color:#555;margin-left:4px">Renta media/persona (INE)</span>';
}

// ===== LEVELS =====
function showProvincia() {
  level = 'provincia'; activeMun = null; activeSec = null;
  map.setFilter('secciones-fill', null);
  map.setFilter('secciones-line', null);

  if (rentaVisible) {
    // Keep renta colors active
  } else {
    map.setPaintProperty('secciones-fill','fill-color','#d4c4a0');
    map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0]);
    map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.15,0]);
  }
  if(map.getLayer('mun-labels')) map.setLayoutProperty('mun-labels','visibility','visible');
  removeBuildings();
  removeAllBuildings();
  removeMunHighlight();

  map.flyTo({center:PROVINCE_CENTER, zoom:PROVINCE_ZOOM, pitch:0, bearing:0, duration:1000, essential:true});
  updateUI();
}

function enterMunicipio(mun) {
  level = 'municipio'; activeMun = mun; activeSec = null;
  removeBuildings();
  removeAllBuildings();

  map.setFilter('secciones-fill', ['==',['get','mun'], mun]);
  map.setFilter('secciones-line', ['==',['get','mun'], mun]);
  map.setPaintProperty('secciones-line','line-opacity',['case',['boolean',['feature-state','hover'],false],0.6,0.25]);
  map.setPaintProperty('secciones-fill','fill-opacity',['case',['boolean',['feature-state','hover'],false],0.25,0.05]);
  if(map.getLayer('mun-labels')) map.setLayoutProperty('mun-labels','visibility','none');

  var munSecs = SECCIONES.features.filter(function(f){return f.properties.mun === mun;});
  showMunHighlight(munSecs);

  var munInfo = MUNICIPIOS.features.find(function(f){return f.properties.mun === mun;});
  if(munInfo) {
    var c = munInfo.properties.center;
    var zoom = munSecs.length > 50 ? 13 : munSecs.length > 20 ? 12.5 : 12;
    map.flyTo({center:c, zoom:zoom, pitch:0, duration:1200, essential:true});
  }
  updateUI();
}

function enterSeccion(cusec, mun) {
  level = 'seccion'; activeSec = cusec; activeMun = mun;

  map.setFilter('secciones-fill', ['==',['get','mun'], mun]);
  map.setFilter('secciones-line', ['==',['get','mun'], mun]);
  map.setPaintProperty('secciones-fill','fill-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.2,0.03]);
  map.setPaintProperty('secciones-line','line-opacity',['case',
    ['==',['get','cusec'],cusec],0,
    ['boolean',['feature-state','hover'],false],0.5,0.12]);

  // If all-buildings mode is on, don't load single section
  if (!allBuildingsOn) {
    showLoading('Cargando edificios...');
    loadMunBuildings(mun).then(function(munData) {
      hideLoading();
      var raw = munData[cusec];
      if (!raw) { console.log('No building data for cusec ' + cusec); return; }
      var features = raw.map(function(b, i) {
        return {
          type:'Feature', id:i,
          geometry:{type:'Polygon',coordinates:[b[0]]},
          properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_id:i,_cusec:cusec}
        };
      });
      renderBuildings(features);
    }).catch(function(err) {
      hideLoading();
      console.log('No building data for mun ' + mun + ': ' + err.message);
    });
  }

  // Fly to section
  var secFeat = SECCIONES.features.find(function(f){return f.properties.cusec === cusec;});
  if(secFeat) {
    var b = getBounds(secFeat.geometry);
    var c = [(b[0][0]+b[1][0])/2, (b[0][1]+b[1][1])/2];
    map.flyTo({center:c, zoom:17, pitch:55, bearing:map.getBearing(), duration:1200, essential:true});
  }

  // Highlight section
  if(secFeat) {
    if(!map.getSource('sec-hl')) map.addSource('sec-hl',{type:'geojson',data:{type:'FeatureCollection',features:[secFeat]}});
    else map.getSource('sec-hl').setData({type:'FeatureCollection',features:[secFeat]});
    if(!map.getLayer('sec-hl-line')) map.addLayer({id:'sec-hl-line',type:'line',source:'sec-hl',paint:{'line-color':'#e0d0b0','line-width':1,'line-opacity':0.5}});
  }

  updateUI();
}

// ===== BUILDINGS =====
function renderBuildings(features) {
  removeBuildings();
  var data = {type:'FeatureCollection',features:features};

  // Shadow layer
  var shadows = features.map(function(f){
    var h = f.properties._h || 8;
    var coords = f.geometry.coordinates[0].map(function(c){
      return [c[0] + h*0.000004, c[1] - h*0.000003];
    });
    return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{_h:h}};
  });
  if(!map.getSource('bld-shadow')) map.addSource('bld-shadow',{type:'geojson',data:{type:'FeatureCollection',features:shadows}});
  else map.getSource('bld-shadow').setData({type:'FeatureCollection',features:shadows});
  map.addLayer({
    id:'bld-shadow',type:'fill',source:'bld-shadow',
    paint:{'fill-color':'#000','fill-opacity':['interpolate',['linear'],['get','_h'],3,0.10,8,0.18,15,0.28,25,0.35]}
  });

  if(!map.getSource('buildings')) map.addSource('buildings',{type:'geojson',data:data});
  else map.getSource('buildings').setData(data);
  map.addLayer({
    id:'buildings-3d',type:'fill-extrusion',source:'buildings',
    paint:{
      'fill-extrusion-color':['case',['boolean',['feature-state','hover'],false],'#f0e0c0','#c8b898'],
      'fill-extrusion-height':['get','_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.92,
      'fill-extrusion-vertical-gradient':true
    }
  });

  // Hover
  var bHov = null;
  map.on('mousemove','buildings-3d',function(e){
    if(!e.features.length) return;
    map.getCanvas().style.cursor='pointer';
    if(bHov!==null) map.setFeatureState({source:'buildings',id:bHov},{hover:false});
    bHov = e.features[0].id;
    map.setFeatureState({source:'buildings',id:bHov},{hover:true});
  });
  map.on('mouseleave','buildings-3d',function(){
    map.getCanvas().style.cursor='';
    if(bHov!==null){map.setFeatureState({source:'buildings',id:bHov},{hover:false});bHov=null;}
  });
  map.on('click','buildings-3d',function(e){
    if(!e.features||!e.features.length) return;
    var p = e.features[0].properties;
    var h = parseFloat(p._h)||8;
    var floors = Math.round(h/3);
    var html = '<div style="padding:10px;font-size:11px">';
    html += '<div style="font-size:13px;font-weight:700;color:#d4c4a0;margin-bottom:4px">Edificio</div>';
    html += '<div style="color:#666;margin-bottom:2px">Altura: <span style="color:#ccc">'+Math.round(h)+'m</span> &middot; Plantas: <span style="color:#ccc">'+floors+'</span></div>';
    html += '<div style="color:#666">Secci&oacute;n: <span style="color:#ccc">'+(p._cusec||'—')+'</span></div>';
    html += '</div>';
    new maplibregl.Popup({maxWidth:'250px'}).setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
}

function removeBuildings() {
  ['bld-shadow','buildings-3d','sec-hl-line'].forEach(function(id){
    if(map.getLayer(id)) map.removeLayer(id);
  });
}

// ===== ALL BUILDINGS TOGGLE =====
function toggleAllBuildings() {
  allBuildingsOn = !allBuildingsOn;
  var btn = document.getElementById('all-buildings-toggle');
  btn.classList.toggle('active', allBuildingsOn);

  if (allBuildingsOn) {
    loadAllBuildingsForMun(activeMun);
  } else {
    removeAllBuildings();
    // If we're at seccion level, reload single section buildings
    if (level === 'seccion' && activeSec) {
      var secFile = 'buildings/' + activeSec + '.json';
      fetch(secFile).then(function(r){
        if(!r.ok) throw new Error('No buildings');
        return r.json();
      }).then(function(raw){
        var features = raw.map(function(b,i){
          return {
            type:'Feature',id:i,
            geometry:{type:'Polygon',coordinates:[b[0]]},
            properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_id:i,_cusec:activeSec}
          };
        });
        renderBuildings(features);
      }).catch(function(){});
    }
  }
}

function loadAllBuildingsForMun(mun) {
  if (!mun || !SECCIONES) return;
  removeBuildings();
  removeAllBuildings();

  showLoading('Cargando todos los edificios del municipio...');

  loadMunBuildings(mun).then(function(munData) {
    hideLoading();
    var allFeatures = [];
    var featureIdCounter = 0;
    Object.keys(munData).forEach(function(cusec) {
      var raw = munData[cusec];
      raw.forEach(function(b) {
        allFeatures.push({
          type:'Feature', id:featureIdCounter++,
          geometry:{type:'Polygon',coordinates:[b[0]]},
          properties:{_h:b[1],'building:levels':b.length>2?b[2]:0,_cusec:cusec}
        });
      });
    });
    if (allFeatures.length > 0 && allBuildingsOn) {
      renderAllBuildings(allFeatures);
    }
  }).catch(function(err) {
    hideLoading();
    console.log('No building data for mun ' + mun + ': ' + err.message);
  });
}

function renderAllBuildings(features) {
  var data = {type:'FeatureCollection',features:features};

  // Shadow layer
  var shadows = features.map(function(f){
    var h = f.properties._h || 8;
    var coords = f.geometry.coordinates[0].map(function(c){
      return [c[0] + h*0.000004, c[1] - h*0.000003];
    });
    return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{_h:h}};
  });

  if(!map.getSource('all-bld-shadow')) map.addSource('all-bld-shadow',{type:'geojson',data:{type:'FeatureCollection',features:shadows}});
  else map.getSource('all-bld-shadow').setData({type:'FeatureCollection',features:shadows});
  map.addLayer({
    id:'all-bld-shadow',type:'fill',source:'all-bld-shadow',
    paint:{'fill-color':'#000','fill-opacity':['interpolate',['linear'],['get','_h'],3,0.08,8,0.14,15,0.22,25,0.30]}
  });

  if(!map.getSource('all-buildings')) map.addSource('all-buildings',{type:'geojson',data:data});
  else map.getSource('all-buildings').setData(data);
  map.addLayer({
    id:'all-buildings-3d',type:'fill-extrusion',source:'all-buildings',
    paint:{
      'fill-extrusion-color':'#c8b898',
      'fill-extrusion-height':['get','_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.88,
      'fill-extrusion-vertical-gradient':true
    }
  });

  allBuildingsLoaded = features;
  console.log('Rendered ' + features.length + ' buildings for municipality');
}

function removeAllBuildings() {
  ['all-bld-shadow','all-buildings-3d'].forEach(function(id){
    if(map.getLayer(id)) map.removeLayer(id);
  });
  allBuildingsLoaded = [];
}

function showMunHighlight(secs) {
  removeMunHighlight();
  var data = {type:'FeatureCollection',features:secs};
  if(!map.getSource('mun-hl')) map.addSource('mun-hl',{type:'geojson',data:data});
  else map.getSource('mun-hl').setData(data);

function updateUI() {

  updateStats();
  updateMunList();

function updateBreadcrumb() {
  var bc = document.getElementById('bc');
  var parts = [];
  if(level === 'provincia') {
    parts.push('<span class="active">Las Palmas</span>');
  } else {
    parts.push('<span onclick="showProvincia()">Las Palmas</span>');
    parts.push('<span class="sep">&#8250;</span>');
  }
  if(level === 'municipio') {
    var nm = getMunName(activeMun);
    parts.push('<span class="active">'+nm+'</span>');
  } else if(level === 'seccion') {
    var nm = getMunName(activeMun);
    parts.push('<span onclick="enterMunicipio(\''+activeMun+'\')">'+nm+'</span>');
    parts.push('<span class="sep">&#8250;</span>');
    parts.push('<span class="active">S'+activeSec.slice(-3)+'</span>');

function updateStats() {
  var el = document.getElementById('stats');
  if(level === 'provincia') {
    el.innerHTML = '<b>3</b> islas &middot; <b>34</b> municipios &middot; <b>709</b> secciones censales<br>Prov. 35 &middot; <b>3 islas</b>';
  } else if(level === 'municipio') {
    var secs = SECCIONES.features.filter(function(f){return f.properties.mun===activeMun;});
    var island = ISLAND_FOR_MUN[activeMun] || '?';
    el.innerHTML = '<b>'+secs.length+'</b> secciones &middot; '+island+'<br>Click en secci&oacute;n para ver edificios';
  } else if(level === 'seccion') {
    el.innerHTML = 'Secci&oacute;n <b>'+activeSec+'</b><br>Municipio: <b>'+getMunName(activeMun)+'</b>';
  }

function updateMunList() {
  var el = document.getElementById('mun-list');
  if(level === 'seccion') { el.innerHTML = ''; return; }

  var muns = MUNICIPIOS.features.slice().sort(function(a,b){
    return a.properties.nmun.localeCompare(b.properties.nmun);
  });

  var html = '';
  ['Gran Canaria','Fuerteventura','Lanzarote'].forEach(function(island) {
    html += '<div style="font-size:8px;color:#444;margin:6px 0 2px;text-transform:uppercase;letter-spacing:1px">'+island+'</div>';
    muns.forEach(function(f) {
      var p = f.properties;
      if(ISLAND_FOR_MUN[p.mun] !== island) return;
      var isActive = p.mun === activeMun;
      html += '<div class="mun-item'+(isActive?' active':'')+'" onclick="enterMunicipio(\''+p.mun+'\')">';
      html += '<span class="name">'+p.nmun+'</span>';
      html += '<span class="count">'+p.sections+'</span>';
      html += '</div>';

}

function updateAllBuildingsToggleVisibility() {
  var btn = document.getElementById('all-buildings-toggle');

    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';

    if (allBuildingsOn) {

      btn.classList.remove('active');
      removeAllBuildings();
    }
  }
}

function getMunName(mun) {
  var f = MUNICIPIOS.features.find(function(f){return f.properties.mun === mun;});
  return f ? f.properties.nmun : mun;
}

// ===== HELPERS =====
function getBounds(geom){
  var minLng=180,maxLng=-180,minLat=90,maxLat=-90;
  function scan(c){
    if(typeof c[0]==='number'){
      if(c[0]<minLng)minLng=c[0];if(c[0]>maxLng)maxLng=c[0];
      if(c[1]<minLat)minLat=c[1];if(c[1]>maxLat)maxLat=c[1];
    }else{for(var i=0;i<c.length;i++)scan(c[i]);}
  }
  scan(geom.coordinates);
  return[[minLng,minLat],[maxLng,maxLat]];
}
function showLoading(msg){var l=document.getElementById('loading');l.textContent=msg;l.classList.add('on');}
function hideLoading(){document.getElementById('loading').classList.remove('on');}

  ]}
];

var ACTIVE_LAYERS = new Set();
var LAYER_PANEL_OPEN = false;

function renderLayerPanel(){
  var body = document.getElementById('layer-panel-body');
  if(!body) return;
  body.innerHTML = '';
  LAYER_CATALOG.forEach(function(cat, idx){
    var open = idx === 0 || cat.layers.some(function(l){return ACTIVE_LAYERS.has(l.id);});
    var group = document.createElement('div');
    group.className = 'cat-group' + (open ? ' open' : '');
    group.innerHTML =
      '<div class="cat-header" onclick="this.parentElement.classList.toggle(\'open\')">' +
        '<span class="cat-title">' + cat.label + '</span>' +
        '<span class="cat-arrow">▶</span>' +
      '</div>' +
      '<div class="cat-body"></div>';
    var catBody = group.querySelector('.cat-body');
    cat.layers.forEach(function(l){
      var row = document.createElement('div');
      var isActive = ACTIVE_LAYERS.has(l.id);
      var isReady = l.status === 'ready';
      row.className = 'layer-row' + (isActive ? ' active' : '') + (!isReady ? ' disabled' : '');
      if(isReady){
        row.onclick = function(){ window[l.toggle](); };
      }
      row.innerHTML =
        '<div class="layer-checkbox"></div>' +
        '<div class="layer-info">' +
          '<div class="layer-name">' +
            '<span class="layer-dot" style="background:' + l.dot + '"></span>' +
            l.name +
            (!isReady ? '<span class="layer-soon">PRÓXIMAMENTE</span>' : '') +
          '</div>' +
          '<div class="layer-source">' + l.source + '</div>' +
        '</div>';
      catBody.appendChild(row);
    });
    body.appendChild(group);
  });
  updateLayerBtnCount();
}

function updateLayerBtnCount(){
  var btn = document.getElementById('layer-btn');
  var count = document.getElementById('layer-btn-count');
  var n = ACTIVE_LAYERS.size;
  if(n > 0){
    count.style.display = '';
    count.textContent = String(n);
    btn.classList.add('has-active');
  } else {
    count.style.display = 'none';
    btn.classList.remove('has-active');
  }
}

function toggleLayerPanel(){
  LAYER_PANEL_OPEN = !LAYER_PANEL_OPEN;
  document.getElementById('layer-panel').classList.toggle('open', LAYER_PANEL_OPEN);
  document.getElementById('layer-panel').setAttribute('aria-hidden', String(!LAYER_PANEL_OPEN));
  if(LAYER_PANEL_OPEN) renderLayerPanel();
}

function syncActiveLayer(layerId, on){
  if(on) ACTIVE_LAYERS.add(layerId); else ACTIVE_LAYERS.delete(layerId);
  if(LAYER_PANEL_OPEN) renderLayerPanel(); else updateLayerBtnCount();
  syncURL();
}

function syncURL(){
  var params = new URLSearchParams(window.location.search);
  if(ACTIVE_LAYERS.size){
    params.set('capas', Array.from(ACTIVE_LAYERS).join(','));
  } else {
    params.delete('capas');
  }
  var newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
  window.history.replaceState({}, '', newUrl);
}

function applyURLLayers(){
  var params = new URLSearchParams(window.location.search);
  var capas = (params.get('capas') || '').split(',').filter(Boolean);
  capas.forEach(function(id){
    var entry = null;
    LAYER_CATALOG.forEach(function(c){c.layers.forEach(function(l){if(l.id===id) entry=l;});});
    if(entry && entry.status === 'ready' && window[entry.toggle]) {
      window[entry.toggle]();
    }
  });
}

//  CAPA CENTROS EDUCATIVOS
//  Fuente: Consejería de Educación, FP, Actividad Física y Deportes,
//  vía datos.canarias.es. ~750 centros prov 35 con coords.
//  Categorías: público (azul), concertado (azul claro).

var educacionVisible = false;
var educacionPopup = null;

function setupEducacionLayer(data){
  if(map.getSource('educacion')) return;
  map.addSource('educacion', {
    type:'geojson',
    data:data,
    cluster:true,
    clusterMaxZoom:13,
    clusterRadius:40
  });

  // Clusters
  map.addLayer({
    id:'educacion-clusters', type:'circle', source:'educacion',
    filter:['has','point_count'],
    paint:{
      'circle-color':['step',['get','point_count'],
        '#5a90c0',  10, '#3d7aa8',  50, '#2d5a85'
      ],
      'circle-radius':['step',['get','point_count'], 9, 10, 14, 50, 20],
      'circle-opacity':0.8,
      'circle-stroke-width':1.5,
      'circle-stroke-color':'rgba(20,16,10,0.9)'
    },
    layout:{visibility:'none'}
  });
  map.addLayer({
    id:'educacion-cluster-count', type:'symbol', source:'educacion',
    filter:['has','point_count'],
    layout:{
      'text-field':['get','point_count_abbreviated'],
      'text-font':['Noto Sans Regular'],
      'text-size':['step',['get','point_count'], 11, 50, 13],
      visibility:'none'
    },
    paint:{
      'text-color':'#fff',
      'text-halo-color':'rgba(0,0,0,0.5)',
      'text-halo-width':1
    }
  });

  // Puntos individuales (zoom alto). Color por categoría.
  map.addLayer({
    id:'educacion-points', type:'circle', source:'educacion',
    filter:['!',['has','point_count']],
    paint:{
      'circle-color':['match',['get','categoria'],
        'publico','#5a90c0',
        'concertado','#9ec0d8',
        'privado','#c08a5a',
        '#888'
      ],
      'circle-radius':['interpolate',['linear'],['zoom'],13,4,17,8,19,11],
      'circle-opacity':0.9,
      'circle-stroke-width':1.2,
      'circle-stroke-color':'rgba(15,12,10,0.9)'
    },
    layout:{visibility:'none'}
  });

  // Cluster click → zoom in
  map.on('click','educacion-clusters', function(e){
    var f = map.queryRenderedFeatures(e.point,{layers:['educacion-clusters']})[0];
    if(!f) return;
    var cid = f.properties.cluster_id;
    map.getSource('educacion').getClusterExpansionZoom(cid).then(function(z){
      map.flyTo({center:f.geometry.coordinates, zoom:Math.min(z,17), essential:true});
    });
  });
  map.on('mouseenter','educacion-clusters',function(){map.getCanvas().style.cursor='pointer';});
  map.on('mouseleave','educacion-clusters',function(){map.getCanvas().style.cursor='';});

  // Punto individual click → popup
  map.on('click','educacion-points', function(e){
    if(!e.features.length) return;
    var p = e.features[0].properties;
    var color = p.categoria === 'publico' ? '#5a90c0' :
                p.categoria === 'concertado' ? '#9ec0d8' :
                p.categoria === 'privado' ? '#c08a5a' : '#888';
    var html = '<div style="padding:8px 4px;font-size:11px;line-height:1.5;max-width:240px">'
      + '<div style="font-size:9px;letter-spacing:1.5px;color:'+color+';text-transform:uppercase">'
      + (p.etapa || 'Centro') + (p.categoria ? ' · ' + p.categoria : '') + '</div>'
      + '<div style="color:#d4c4a0;font-weight:600;margin:3px 0">' + (p.nombre || '(sin nombre)') + '</div>'
      + (p.etapa_desc ? '<div style="color:#a89c80;font-size:10px;margin-bottom:4px">' + p.etapa_desc + '</div>' : '')
      + '<div style="color:#8a8070;font-size:10px">' + [p.direccion, p.localidad, p.municipio].filter(Boolean).join(' · ') + '</div>'
      + (p.web ? '<div style="margin-top:6px"><a href="' + p.web + '" target="_blank" rel="noopener" style="color:#9ec0d8;font-size:10px">Web del centro ↗</a></div>' : '')
      + '</div>';
    if(educacionPopup) educacionPopup.remove();
    educacionPopup = new maplibregl.Popup({closeButton:true,maxWidth:'280px',offset:8})
      .setLngLat(e.features[0].geometry.coordinates).setHTML(html).addTo(map);
  });
  map.on('mouseenter','educacion-points',function(){map.getCanvas().style.cursor='pointer';});
  map.on('mouseleave','educacion-points',function(){map.getCanvas().style.cursor='';});
}

function toggleEducacion(){
  if(!map.getSource('educacion')){
    fetch('data/centros-educativos-prov35.geojson').then(function(r){return r.json();}).then(function(data){
      setupEducacionLayer(data);

var coberturaBusVisible = false;

function setupCoberturaBusLayer(data){
  if(map.getSource('cobertura-bus')) return;
  map.addSource('cobertura-bus', {type:'geojson', data:data});
  map.addLayer({
    id:'cobertura-bus-fill', type:'fill', source:'cobertura-bus',
    paint:{
      'fill-color':'#5dc88a',
      'fill-opacity':['interpolate',['linear'],['zoom'], 11,0.18, 14,0.22, 17,0.16]
    },

  'CENTRO_PU':'Punto de urgencia'

function saludMapClickHandler(e){
  if(!saludVisible) return;
  var canvas = map.getCanvas();
  var pixelW = canvas.width / (window.devicePixelRatio || 1);
  var pixelH = canvas.height / (window.devicePixelRatio || 1);
  var i = Math.round(e.point.x);
  var j = Math.round(e.point.y);
  var b = map.getBounds();
  var bbox = [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');
  var url = SALUD_WMS_URL +
    '?service=WMS&version=1.1.1&request=GetFeatureInfo' +
    '&layers=' + SALUD_LAYERS_ALL +
    '&query_layers=' + SALUD_LAYERS_ALL +
    '&srs=EPSG:4326&bbox=' + bbox +
    '&width=' + Math.round(pixelW) + '&height=' + Math.round(pixelH) +
    '&x=' + i + '&y=' + j +
    '&info_format=application/vnd.ogc.gml';

  fetch(url).then(function(r){return r.text();}).then(function(xml){
    var info = parseSaludGML(xml);
    if(!info.length) return;
    var html = info.map(function(f){
      return '<div style="padding:8px 4px;font-size:11px;line-height:1.55;border-top:1px solid #2a2520;margin-top:6px">'
        + '<div style="font-size:9px;letter-spacing:1.5px;color:#c8d05a;text-transform:uppercase">'
        + (SALUD_LAYER_NAMES[f.tipo] || f.tipo) + '</div>'
        + '<div style="color:#d4c4a0;font-weight:600;margin:2px 0">'
        + (f.nombre || f.NOMBRE || f.denominacion || 'Sin denominación') + '</div>'
        + (f.direccion || f.DIRECCION ? '<div style="color:#a89c80;font-size:10px">' + (f.direccion||f.DIRECCION) + '</div>' : '')
        + (f.municipio || f.MUNICIPIO ? '<div style="color:#8a8070;font-size:10px">' + (f.municipio||f.MUNICIPIO) + '</div>' : '')
        + (f.telefono || f.TELEFONO ? '<div style="color:#8a8070;font-size:10px;margin-top:2px">📞 ' + (f.telefono||f.TELEFONO) + '</div>' : '')
        + '</div>';
    }).join('');
    if(saludPopup) saludPopup.remove();
    saludPopup = new maplibregl.Popup({closeButton:true,maxWidth:'280px',offset:8})
      .setLngLat(e.lngLat)
      .setHTML('<div style="padding:0 6px 4px"><div style="font-size:9px;letter-spacing:1.5px;color:#888">SANIDAD · ' + info.length + (info.length===1?' RESULTADO':' RESULTADOS') + '</div>' + html + '</div>')
      .addTo(map);
  }).catch(function(err){
    console.warn('GetFeatureInfo Salud falló:', err);
  });
}

function parseSaludGML(xml){
  var out = [];
  var doc = new DOMParser().parseFromString(xml, 'text/xml');
  Array.from(doc.getElementsByTagName('*')).forEach(function(el){
    if(/_feature$/.test(el.localName || el.tagName)){
      var tipo = (el.parentNode.localName || el.parentNode.tagName).replace(/_layer$/,'');
      var feat = {tipo:tipo};
      Array.from(el.children).forEach(function(c){
        var k = c.localName || c.tagName;
        if(k === 'boundedBy' || k.indexOf(':') !== -1) return;
        feat[k] = (c.textContent || '').trim();
      });
      out.push(feat);
    }
  });
  return out;
}

// Click en el mapa → GetFeatureInfo si la capa BIC está activa.
// Lo hacemos sobre el contenedor entero del mapa (no es vector, no hay
// 'click' nativo en una capa raster).
function bicMapClickHandler(e){
  if(!bicVisible) return;
  var canvas = map.getCanvas();
  var rect = canvas.getBoundingClientRect();
  var pixelW = canvas.width / (window.devicePixelRatio || 1);
  var pixelH = canvas.height / (window.devicePixelRatio || 1);
  var i = Math.round(e.point.x);
  var j = Math.round(e.point.y);
  var b = map.getBounds();
  // WMS 1.1.1 espera bbox=minLng,minLat,maxLng,maxLat con SRS=EPSG:4326
  var bbox = [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');
  var url = BIC_WMS_URL +
    '?service=WMS&version=1.1.1&request=GetFeatureInfo' +
    '&layers=' + BIC_LAYERS_ALL +
    '&query_layers=' + BIC_LAYERS_ALL +
    '&srs=EPSG:4326&bbox=' + bbox +
    '&width=' + Math.round(pixelW) + '&height=' + Math.round(pixelH) +
    '&x=' + i + '&y=' + j +
    '&info_format=application/vnd.ogc.gml';

  fetch(url).then(function(r){return r.text();}).then(function(xml){
    var info = parseBICGML(xml);
    if(!info.length) return;
    var html = info.map(function(f){
      return '<div style="padding:8px 4px;font-size:11px;line-height:1.55;border-top:1px solid #2a2520;margin-top:6px">'
        + '<div style="font-size:9px;letter-spacing:1px;color:#c44a4a;text-transform:uppercase">'
        + (BIC_LAYER_NAMES[f.tipo] || f.tipo) + '</div>'
        + '<div style="color:#d4c4a0;font-weight:600;margin:2px 0">'
        + (f.deno_bic || 'Sin denominación') + '</div>'
        + (f.fecha_decl ? '<div style="color:#8a8070;font-size:10px">Declarado ' + formatBICFecha(f.fecha_decl) + '</div>' : '')
        + (f.descripcio ? '<div style="color:#a89c80;margin-top:6px;max-height:140px;overflow-y:auto">'
            + escapeHtml(f.descripcio).slice(0,400) + (f.descripcio.length > 400 ? '…' : '') + '</div>' : '')
        + '</div>';
    }).join('');
    if(bicPopup) bicPopup.remove();
    bicPopup = new maplibregl.Popup({closeButton:true,maxWidth:'320px',offset:8})
      .setLngLat(e.lngLat)
      .setHTML('<div style="padding:0 6px 4px"><div style="font-size:9px;letter-spacing:1.5px;color:#888">PATRIMONIO BIC · ' + info.length + (info.length===1?' RESULTADO':' RESULTADOS') + '</div>' + html + '</div>')
      .addTo(map);
  }).catch(function(err){
    console.warn('GetFeatureInfo BIC falló:', err);
  });
}

function parseBICGML(xml){
  var out = [];
  var parser = new DOMParser();
  var doc = parser.parseFromString(xml, 'text/xml');
  var layers = doc.querySelectorAll('[*|name]');
  // Recorremos cualquier *_feature dentro de cualquier *_layer
  Array.from(doc.getElementsByTagName('*')).forEach(function(el){
    if(/_feature$/.test(el.localName || el.tagName)){
      var tipo = (el.parentNode.localName || el.parentNode.tagName).replace(/_layer$/,'');
      var feat = {tipo:tipo};
      Array.from(el.children).forEach(function(c){
        var k = c.localName || c.tagName;
        if(k === 'boundedBy' || k.indexOf(':') !== -1) return;
        feat[k] = (c.textContent || '').trim();
      });
      if(feat.deno_bic || feat.descripcio) out.push(feat);
    }
  });
  return out;
}

function formatBICFecha(s){
  // entrada esperada: "1973/04/05" o "19730405"
  if(/^\d{4}\/\d{2}\/\d{2}/.test(s)){
    var p = s.split('/');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  if(/^\d{8}/.test(s)){
    return s.substr(6,2) + '/' + s.substr(4,2) + '/' + s.substr(0,4);
  }
  return s;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function showBICLegend(show){
  var el = document.getElementById('bic-legend');
  if(!show){if(el) el.style.display='none'; return;}
  if(!el){
    el = document.createElement('div');
    el.id = 'bic-legend';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(10,10,10,0.94);border:1px solid #222;border-radius:8px;padding:8px 14px;font-size:9px;color:#aaa;display:flex;align-items:center;gap:10px;backdrop-filter:blur(12px);max-width:90vw;flex-wrap:wrap;justify-content:center';
    document.body.appendChild(el);
  }
  el.style.display = 'flex';
  el.innerHTML = '<span style="color:#c44a4a;font-size:11px">▢</span>' +
    '<span><b style="color:#c44a4a">BIC — Bienes de Interés Cultural</b> · click sobre el mapa para ver detalles</span>' +
    '<span style="color:#444;margin-left:6px;font-size:8px">GRAFCAN · D.G. Patrimonio Cultural</span>';
}

// Hook al click — solo se activa si la capa BIC está visible.
map.on('load', function(){
  // Inicializar panel y URL
  renderLayerPanel();
  setTimeout(applyURLLayers, 250); // tras carga inicial de boundaries
  // Click handler global para BIC GetFeatureInfo
  map.on('click', bicMapClickHandler);
});
</script>
